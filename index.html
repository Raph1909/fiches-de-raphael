function renderSearchResults(query){
  const q = query.toLowerCase();
  const matches = data.fiches.filter(f => f.title.toLowerCase().includes(q) || f.content.toLowerCase().includes(q) || (f.tags||[]).some(t=>t.toLowerCase().includes(q)));
  const cardsHtml = matches.map(f=>renderFicheCard(f,{showSubject:true})).join('');
  return `
    <p class="eyebrow">Recherche</p>
    <h1 class="hero" style="font-size:2rem;">${matches.length} résultat${matches.length===1?'':'s'} pour « ${esc(query)} »</h1>
    ${matches.length ? `<div class="grid" style="margin-top:26px;">${cardsHtml}</div>` : `<div class="empty-state" style="margin-top:26px;"><p>Aucune fiche ne correspond à cette recherche.</p></div>`}
  `;
}

function renderAllToReview(){
  const list = data.fiches.filter(f=>isDueForReview(f))
    .sort((a,b)=> (b.dateEdited||b.dateAdded).localeCompare(a.dateEdited||a.dateAdded));
  const cardsHtml = list.map(f=>renderFicheCard(f,{showSubject:true})).join('');
  return `
    <p class="eyebrow">Toutes matières</p>
    <h1 class="hero" style="font-size:2rem;">🔶 À revoir</h1>
    <p class="lede">Fiches jamais évaluées, ou dont la date de révision suggérée est passée.</p>
    ${list.length ? `<div class="grid" style="margin-top:6px;">${cardsHtml}</div>` : `<div class="empty-state" style="margin-top:26px;"><p>Rien à revoir pour l'instant, bien joué !</p></div>`}
  `;
}

function renderPriorityView(){
  const due = data.fiches.filter(f=>isDueForReview(f));
  const ranked = due
    .map(f=>({ f, rank: activeRank(f.subjectId) }))
    .filter(x=>x.rank>=0)
    .sort((a,b)=> a.rank - b.rank || (a.f.confidence===undefined?3:a.f.confidence) - (b.f.confidence===undefined?3:b.f.confidence));
  const cardsHtml = ranked.map(x=>renderFicheCard(x.f,{showSubject:true})).join('');
  return `
    <p class="eyebrow">Toutes matières</p>
    <h1 class="hero" style="font-size:2rem;">🎯 Vue priorité</h1>
    <p class="lede">Les fiches à revoir, classées d'abord par importance de la matière, puis par confiance la plus faible.</p>
    ${ranked.length ? `<div class="grid" style="margin-top:6px;">${cardsHtml}</div>` : `<div class="empty-state" style="margin-top:26px;"><p>Rien à prioriser pour l'instant.</p></div>`}
  `;
}

function sortFilterBarHtml(){
  return `
    <div class="sort-filter-row no-print">
      <select onchange="setSort(this.value)" aria-label="Trier">
        <option value="date-desc" ${currentSort==='date-desc'?'selected':''}>Plus récent d'abord</option>
        <option value="date-asc" ${currentSort==='date-asc'?'selected':''}>Plus ancien d'abord</option>
        <option value="title-asc" ${currentSort==='title-asc'?'selected':''}>Titre A→Z</option>
        <option value="title-desc" ${currentSort==='title-desc'?'selected':''}>Titre Z→A</option>
        <option value="status" ${currentSort==='status'?'selected':''}>Confiance (moins sûr d'abord)</option>
        <option value="manuel" ${currentSort==='manuel'?'selected':''}>Ordre manuel (glisser-déposer)</option>
      </select>
      <select onchange="setFilter(this.value)" aria-label="Filtrer">
        <option value="all" ${currentFilter==='all'?'selected':''}>Toutes les fiches</option>
        <option value="a-revoir" ${currentFilter==='a-revoir'?'selected':''}>À revoir maintenant</option>
        <option value="maitrisee" ${currentFilter==='maitrisee'?'selected':''}>Bien maîtrisées (4-5)</option>
        <option value="sans-statut" ${currentFilter==='sans-statut'?'selected':''}>Jamais évaluées</option>
      </select>
    </div>`;
}

function renderSubjectView(id){
  const s = getSubject(id);
  if(!s) return renderHome();
  const totalCount = fichesOf(id).length;
  const visible = visibleFichesOf(id);
  let body;
  if(!totalCount){
    body = `<div class="empty-state">
      <p>Aucune fiche ici pour l'instant. La prochaine sur « ${esc(s.name)} » atterrira dans cette page.</p>
      <button class="btn" onclick="openAddFiche('${s.id}')">+ Ajouter une fiche</button>
    </div>`;
  }else if(!visible.length){
    body = `<div class="empty-state"><p>Aucune fiche ne correspond à ce filtre.</p></div>`;
  }else{
    const hasChapters = visible.some(f=>f.chapter && f.chapter.trim());
    if(hasChapters && currentSort!=='manuel'){
      body = groupByChapter(visible).map(g=>`
        <h3 class="chapter-heading">${esc(g.label)}</h3>
        <div class="grid">${g.fiches.map(f=>renderFicheCard(f)).join('')}</div>
      `).join('');
    }else{
      body = `<div class="grid">${visible.map(f=>renderFicheCard(f)).join('')}</div>`;
    }
  }
  const archivedNote = s.archived ? `<div class="reminder-card" style="margin-bottom:20px;"><div class="reminder-label">📦 Matière archivée</div><div class="reminder-line">Elle n'apparaît plus dans le menu ni sur l'accueil. <button type="button" class="link-chip" onclick="toggleArchiveSubject('${s.id}')">Désarchiver</button></div></div>` : '';
  const examDays = daysUntil(s.examDate);
  const examBadgeHtml = examDays !== null ? `<span class="exam-badge">⏳ ${examBadgeLabel(examDays)}</span>` : '';

  return `
    ${archivedNote}
    <div class="subject-header">
      <div>
        <h1><span class="swatch-lg" style="background:${s.color}"></span>${s.emoji ? esc(s.emoji)+' ' : ''}${esc(s.name)}${examBadgeHtml}</h1>
        <div class="meta">${totalCount} fiche${totalCount===1?'':'s'}${s.archived ? '' : ' · #'+pad2(activeRank(id)+1)+' par importance'}</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        ${totalCount ? `<button class="btn ghost small" onclick="openFlashcards('${s.id}')">🃏 Réviser</button>` : ''}
        ${totalCount ? `<button class="btn ghost small" onclick="openPresentation('${s.id}')">👥 Présentation à deux</button>` : ''}
        ${totalCount ? `<button class="btn ghost small" onclick="openPrintView('${s.id}')">🖨️ Imprimer</button>` : ''}
        ${totalCount ? `<button class="btn" onclick="openAddFiche('${s.id}')">+ Ajouter une fiche</button>` : ''}
      </div>
    </div>
    ${totalCount ? sortFilterBarHtml() : ''}
    ${body}
  `;
}

function jsQuote(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function renderFicheDetail(id){
  const f = getFiche(id);
  if(!f) return renderHome();
  const s = getSubject(f.subjectId);
  if(readingMode){
    return `
      <div class="reading-mode">
        <button class="back-link no-print" onclick="toggleReadingMode()">✕ Quitter le mode lecture</button>
        <button class="btn ghost small no-print" style="margin-bottom:20px;" onclick="toggleSpeech('${f.id}')">${isSpeaking() ? '⏹️ Arrêter la lecture' : '🔊 Lire à voix haute'}</button>
        <h1 class="fiche-title">${f.pinned ? '📌 ' : ''}${esc(f.title)}</h1>
        ${f.chapter ? `<div class="fiche-date">📂 ${esc(f.chapter)}</div>` : ''}
        ${renderAttachmentsGallery(f)}
        <div class="fiche-content md-content">${renderMarkdownLite(f.content)}</div>
        ${f.sources ? `<p class="fiche-sources">📚 Sources : ${esc(f.sources)}</p>` : ''}
      </div>
    `;
  }
  const chapterHtml = f.chapter ? `<div class="fiche-date">📂 ${esc(f.chapter)}</div>` : '';
  const tagsHtml = (f.tags && f.tags.length) ? `<div class="fiche-tags">${f.tags.map(t=>`<button type="button" class="tag-chip" onclick="openTagView('${jsQuote(t)}')">🏷️ ${esc(t)}</button>`).join('')}</div>` : '';
  const linkedFiches = (f.links||[]).map(lid=>getFiche(lid)).filter(Boolean);
  const linksHtml = linkedFiches.length ? `
    <div class="linked-fiches">
      <div class="linked-label">Voir aussi</div>
      ${linkedFiches.map(lf=>`<button type="button" class="link-chip" onclick="openFiche('${lf.id}')">${esc(lf.title)}</button>`).join('')}
    </div>` : '';
  const history = Array.isArray(f.history) ? [...f.history].reverse() : [];
  const historyHtml = history.length ? `
    <details class="history-section">
      <summary>🕐 Historique (${history.length} version${history.length===1?'':'s'} précédente${history.length===1?'':'s'})</summary>
      ${history.map((h,i)=>{
        const realIdx = f.history.length-1-i;
        return `<div class="history-item">
          <div class="history-date">${fmtDate(h.date)}</div>
          <div class="history-title">${esc(h.title)}</div>
          <button type="button" class="btn ghost small" onclick="restoreVersion('${f.id}', ${realIdx})">↺ Restaurer cette version</button>
        </div>`;
      }).join('')}
    </details>` : '';
  const otherFichesOptions = data.subjects.map(sub=>{
    const opts = data.fiches.filter(o=>o.subjectId===sub.id && o.id!==f.id).map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join('');
    return opts ? `<optgroup label="${esc(sub.name)}">${opts}</optgroup>` : '';
  }).join('');
  const mergeHtml = mergePanelOpen ? `
    <div class="reset-confirm-box" style="border-color:var(--border); margin-top:20px;">
      <p style="font-size:0.85rem; color:var(--ink-soft); margin:0 0 10px;">Choisis la fiche qui recevra le contenu de celle-ci (elle sera supprimée après la fusion) :</p>
      <select id="merge-target-select">${otherFichesOptions}</select>
      <div class="form-actions">
        <button class="btn" onclick="mergeFicheInto('${f.id}', document.getElementById('merge-target-select').value)">Fusionner</button>
        <button class="btn ghost" onclick="toggleMergePanel()">Annuler</button>
      </div>
    </div>` : '';
  return `
    <button class="back-link" onclick="goToSubject('${f.subjectId}')">← ${s ? esc(s.name) : 'Retour'}</button>
    <div class="fiche-detail" style="--tape-color:${s ? s.color : 'var(--accent)'}">
      <h1 class="fiche-title">${f.pinned ? '📌 ' : ''}${esc(f.title)}</h1>
      <div class="fiche-date">Ajoutée le ${fmtDate(f.dateAdded)}${f.dateEdited ? ' · modifiée le ' + fmtDate(f.dateEdited) : ''}</div>
      ${chapterHtml}
      ${tagsHtml}
      ${confidenceRowHtml(f)}
      <div class="status-row">
        <button class="status-btn ${f.pinned?'active':''}" onclick="togglePin('${f.id}')">📌 ${f.pinned ? 'Désépingler' : 'Épingler'}</button>
      </div>
      <div class="reading-toolbar no-print">
        <button class="btn ghost small" onclick="toggleReadingMode()">📖 Mode lecture</button>
        <button class="btn ghost small" onclick="toggleSpeech('${f.id}')">${isSpeaking() ? '⏹️ Arrêter la lecture' : '🔊 Lire à voix haute'}</button>
      </div>
      ${renderAttachmentsGallery(f)}
      <div class="fiche-content md-content">${renderMarkdownLite(f.content)}</div>
      ${f.sources ? `<p class="fiche-sources">📚 Sources : ${esc(f.sources)}</p>` : ''}
      ${linksHtml}
      ${historyHtml}
      ${mergeHtml}
      <div class="fiche-actions">
        ${parseQuiz(f.quiz).length ? `<button class="btn ghost" onclick="openQuiz('${f.id}')">❓ Mode quiz</button>` : ''}
        <button class="btn ghost" onclick="openPrintFiche('${f.id}')">🖨️ Exporter en PDF</button>
        <button class="btn ghost" onclick="shareFiche('${f.id}')">📤 Partager</button>
        <button class="btn ghost" onclick="toggleMergePanel()">🔗 Fusionner avec...</button>
        <button class="btn ghost" onclick="openEditFiche('${f.id}')">Modifier</button>
        <button class="btn ghost" onclick="deleteFiche('${f.id}')">Supprimer cette fiche</button>
      </div>
      <div class="word-cloud-section">
        <h3 class="chapter-heading" style="margin-top:0;">☁️ Nuage de mots-clés</h3>
        ${renderFicheWordCloud(f.id)}
      </div>
    </div>
  `;
}

function renderPrintView(subjectId){
  const s = getSubject(subjectId);
  if(!s) return renderHome();
  const fiches = fichesOf(subjectId);
  const fichesHtml = fiches.map(f=>{
    const imgs = migrateAttachments(f).filter(a=>a.type==='image').map(a=>`<img src="${a.url||a.dataUrl}" class="print-img" alt="">`).join('');
    return `<div class="print-fiche">
      <h2>${esc(f.title)}</h2>
      <div class="print-content md-content">${renderMarkdownLite(f.content)}</div>
      ${imgs}
    </div>`;
  }).join('');
  return `
    <div class="no-print" style="margin-bottom:24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <button class="back-link" onclick="goToSubject('${subjectId}')" style="margin-bottom:0;">← Retour</button>
      <button class="btn" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
    </div>
    <h1 class="print-title">${esc(s.name)}</h1>
    ${fichesHtml || '<p>Aucune fiche à imprimer.</p>'}
  `;
}

function renderPrintFiche(ficheId){
  const f = getFiche(ficheId);
  if(!f) return renderHome();
  const imgs = migrateAttachments(f).filter(a=>a.type==='image').map(a=>`<img src="${a.url||a.dataUrl}" class="print-img" alt="">`).join('');
  const sourcesHtml = f.sources ? `<p class="print-sources">Sources : ${esc(f.sources)}</p>` : '';
  return `
    <div class="no-print" style="margin-bottom:24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <button class="back-link" onclick="openFiche('${f.id}')" style="margin-bottom:0;">← Retour</button>
      <button class="btn" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
    </div>
    <h1 class="print-title">${esc(f.title)}</h1>
    <div class="print-fiche">
      <div class="print-content md-content">${renderMarkdownLite(f.content)}</div>
      ${imgs}
      ${sourcesHtml}
    </div>
  `;
}

function renderFlashcards(view){
  const s = getSubject(view.subjectId);
  if(!s) return renderHome();
  const list = visibleFichesOf(view.subjectId);
  if(!list.length) return renderSubjectView(view.subjectId);
  const idx = Math.min(view.index, list.length-1);
  const f = list[idx];
  return `
    <button class="back-link" onclick="goToSubject('${s.id}')">← ${esc(s.name)}</button>
    <label class="checkbox-row no-print" style="justify-content:center;">
      <input type="checkbox" ${flashcardTimerEnabled?'checked':''} onchange="toggleFlashcardTimerPref()">
      <span>⏱️ Révéler automatiquement après 15 secondes</span>
    </label>
    <div class="flashcard-progress">Carte ${idx+1} / ${list.length}${(!view.revealed && flashcardTimerEnabled) ? ` · <span id="flashcard-countdown">${flashcardSecondsLeft}s</span>` : ''}</div>
    <div class="flashcard">
      <h2 class="flashcard-title">${esc(f.title)}</h2>
      ${view.revealed ? `
        ${f.chapter ? `<div class="fiche-date">📂 ${esc(f.chapter)}</div>` : ''}
        ${renderAttachmentsGallery(f)}
        <div class="fiche-content md-content">${renderMarkdownLite(f.content)}</div>
      ` : `<button class="btn" onclick="flashcardReveal()">👁️ Révéler la réponse</button>`}
    </div>
    ${view.revealed ? `<div style="display:flex; justify-content:center;">${confidenceRowHtml(f)}</div>` : ''}
    <div class="flashcard-nav">
      <button class="btn ghost" onclick="flashcardPrev()" ${idx===0?'disabled':''}>← Précédente</button>
      <button class="btn" onclick="flashcardNext()" ${idx===list.length-1?'disabled':''}>Suivante →</button>
    </div>
  `;
}

function renderPresentation(view){
  const s = getSubject(view.subjectId);
  if(!s) return renderHome();
  const list = visibleFichesOf(view.subjectId);
  if(!list.length) return renderSubjectView(view.subjectId);
  const idx = Math.min(view.index, list.length-1);
  const f = list[idx];
  return `
    <div class="presentation-mode">
      <button class="back-link no-print" onclick="goToSubject('${s.id}')">✕ Quitter le mode présentation</button>
      <div class="presentation-progress">${esc(s.name)} · ${idx+1} / ${list.length}</div>
      <h1 class="presentation-title">${esc(f.title)}</h1>
      ${renderAttachmentsGallery(f)}
      <div class="presentation-content md-content">${renderMarkdownLite(f.content)}</div>
      <div class="presentation-nav">
        <button class="btn ghost presentation-nav-btn" onclick="presentationPrev()" ${idx===0?'disabled':''}>← Précédente</button>
        <button class="btn presentation-nav-btn" onclick="presentationNext()" ${idx===list.length-1?'disabled':''}>Suivante →</button>
      </div>
    </div>
  `;
}

function renderQuiz(view){
  const f = getFiche(view.ficheId);
  if(!f) return renderHome();
  const pairs = parseQuiz(f.quiz);
  if(!pairs.length) return renderFicheDetail(f.id);
  const idx = Math.min(view.index, pairs.length-1);
  const pair = pairs[idx];
  return `
    <button class="back-link" onclick="openFiche('${f.id}')">← ${esc(f.title)}</button>
    <div class="flashcard-progress">Question ${idx+1} / ${pairs.length}</div>
    <div class="flashcard">
      <h2 class="flashcard-title">${esc(pair.q)}</h2>
      ${view.revealed ? `<div class="fiche-content">${esc(pair.a)}</div>` : `<button class="btn" onclick="quizReveal()">👁️ Voir la réponse</button>`}
    </div>
    <div class="flashcard-nav">
      <button class="btn ghost" onclick="quizPrev()" ${idx===0?'disabled':''}>← Précédente</button>
      <button class="btn" onclick="quizNext()" ${idx===pairs.length-1?'disabled':''}>Suivante →</button>
    </div>
  `;
}

function renderPomodoro(){
  return `
    <p class="eyebrow">Concentration</p>
    <h1 class="hero" style="font-size:2rem;">⏱️ Minuteur</h1>
    <div class="pomodoro-modes">
      <button class="btn ${pomodoroState.mode==='travail'?'':'ghost'} small" onclick="pomodoroSetMode('travail')">Travail (25 min)</button>
      <button class="btn ${pomodoroState.mode==='pause'?'':'ghost'} small" onclick="pomodoroSetMode('pause')">Pause (5 min)</button>
    </div>
    <div class="pomodoro-display">
      <div class="pomodoro-time" id="pomodoro-time">${formatPomodoroTime(pomodoroState.seconds)}</div>
      <div class="pomodoro-label">${pomodoroState.mode==='travail' ? 'Séance de travail' : 'Pause'}</div>
    </div>
    <div class="flashcard-nav">
      <button class="btn" onclick="pomodoroToggle()">${pomodoroState.running ? '⏸️ Pause' : '▶️ Démarrer'}</button>
      <button class="btn ghost" onclick="pomodoroReset()">↺ Réinitialiser</button>
    </div>
  `;
}

function renderStats(){
  const buckets = weeklyAddCounts(8);
  const max = Math.max(1, ...buckets.map(b=>b.count));
  const bars = buckets.map(b=>{
    const h = 4 + Math.round((b.count/max)*90);
    const label = b.end.toLocaleDateString('fr-FR',{day:'numeric', month:'short'});
    return `<div class="chart-bar-wrap"><div class="chart-bar" style="height:${h}px" title="${b.count} fiche${b.count===1?'':'s'}"></div><div class="chart-bar-label">${label}</div></div>`;
  }).join('');
  const streak = currentStreak();
  const weekCount = currentWeekCount();
  const goalPct = Math.min(100, Math.round((weekCount/weeklyGoal)*100));
  return `
    <p class="eyebrow">Suivi & motivation</p>
    <h1 class="hero" style="font-size:2rem;">📊 Ton parcours</h1>

    <div class="stats-row">
      <div class="stat"><div class="num">🔥 ${streak}</div><div class="label">Jour${streak===1?'':'s'} d'affilée</div></div>
      <div class="stat"><div class="num">🏆 ${xpLevel()}</div><div class="label">Niveau (${xpTotal} XP)</div></div>
    </div>

    <div class="howitworks">
      <h2>🏅 Badges</h2>
      <div class="badge-grid">${badgeGridHtml()}</div>
    </div>

    <div class="howitworks">
      <h2>Fiches ajoutées par semaine</h2>
      <div class="weekly-chart">${bars}</div>
    </div>

    <div class="howitworks">
      <h2>Objectif de la semaine</h2>
      <div class="goal-row">
        <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${goalPct}%"></div></div>
        <div class="goal-text">${weekCount} / ${weeklyGoal} fiches cette semaine</div>
      </div>
      <div class="goal-edit">
        <label for="goal-input">Objectif hebdomadaire :</label>
        <input type="number" id="goal-input" min="1" max="50" value="${weeklyGoal}" onchange="setWeeklyGoal(parseInt(this.value,10))">
      </div>
    </div>

    <div class="howitworks">
      <h2>Détail par matière</h2>
      <div class="table-scroll">
        <table class="md-table subject-stats-table">
          <tr><th>Matière</th><th>Fiches</th><th>Maîtrisé</th><th>À revoir</th><th>Révisions</th></tr>
          ${subjectStatsRows()}
        </table>
      </div>
      <p style="font-size:0.75rem; color:var(--ink-faint); margin:10px 0 0;">« Révisions » compte le nombre de fois où tu as noté ta confiance sur une fiche de cette matière (≈ temps de révision).</p>
    </div>
  `;
}

// ---------- Badges à débloquer ----------
function computeBadges(){
  const total = data.fiches.length;
  const streak = currentStreak();
  const masteredSubject = activeSubjects().some(s=>isSubjectFullyMastered(s.id));
  return [
    { emoji:'🌱', name:'Premiers pas', desc:'Créer ta première fiche', unlocked: total>=1 },
    { emoji:'📚', name:'10 fiches', desc:'Atteindre 10 fiches au total', unlocked: total>=10 },
    { emoji:'📖', name:'50 fiches', desc:'Atteindre 50 fiches au total', unlocked: total>=50 },
    { emoji:'🎓', name:'100 fiches', desc:'Atteindre 100 fiches au total', unlocked: total>=100 },
    { emoji:'🔥', name:'Série de 7 jours', desc:"Une semaine d'affilée sur le site", unlocked: streak>=7 },
    { emoji:'🔥🔥', name:'Série de 30 jours', desc:"Un mois d'affilée sur le site", unlocked: streak>=30 },
    { emoji:'🏅', name:'Matière maîtrisée', desc:'100% des fiches maîtrisées dans une matière', unlocked: masteredSubject },
    { emoji:'⭐', name:'Niveau 5', desc:'Atteindre le niveau 5 (400 XP)', unlocked: xpLevel()>=5 }
  ];
}
function badgeGridHtml(){
  return computeBadges().map(b=>`
    <div class="badge-chip ${b.unlocked?'unlocked':''}">
      <div class="badge-emoji">${b.emoji}</div>
      <div class="badge-name">${esc(b.name)}</div>
      <div class="badge-desc">${esc(b.desc)}</div>
    </div>
  `).join('');
}

function subjectStatsRows(){
  return activeSubjects().map(s=>{
    const fiches = fichesOf(s.id);
    const total = fiches.length;
    const mastered = fiches.filter(f=>f.confidence!==undefined && f.confidence>=4).length;
    const due = fiches.filter(f=>isDueForReview(f)).length;
    const reviews = fiches.reduce((sum,f)=>sum+(f.reviewCount||0),0);
    const minutes = Math.round(reviews*0.5);
    return `<tr>
      <td><span class="swatch" style="background:${s.color}"></span> ${esc(s.name)}</td>
      <td>${total}</td>
      <td>${total ? Math.round(mastered/total*100) : 0}%</td>
      <td>${due}</td>
      <td>${reviews} (≈${minutes} min)</td>
    </tr>`;
  }).join('');
}

function renderFicheForm(opts){
  opts = opts || {};
  const editing = !!opts.ficheId;
  const f = editing ? getFiche(opts.ficheId) : null;
  if(editing && !f) return renderHome();
  const initialSubject = editing ? f.subjectId : (opts.subjectId || lastSubjectId || (data.subjects[0] && data.subjects[0].id));
  const initialTitle = editing ? f.title : '';
  const initialContent = editing ? f.content : '';
  const initialChapter = editing ? (f.chapter || '') : '';
  const initialQuiz = editing ? (f.quiz || '') : '';
  const initialSources = editing ? (f.sources || '') : '';
  const initialLinks = editing ? (f.links || []) : [];
  const initialTags = editing ? (f.tags || []) : [];
  const options = data.subjects.map(s=>`<option value="${s.id}" ${s.id===initialSubject?'selected':''}>${esc(s.name)}</option>`).join('');
  const backTarget = editing ? `goToSubject('${f.subjectId}')` : (opts.subjectId ? `goToSubject('${opts.subjectId}')` : 'goHome()');
  const linkOptions = data.subjects.map(s=>{
    const opts2 = fichesOf(s.id).filter(o=>!editing || o.id!==f.id)
      .map(o=>`<option value="${o.id}" ${initialLinks.includes(o.id)?'selected':''}>${esc(o.title)}</option>`).join('');
    return opts2 ? `<optgroup label="${esc(s.name)}">${opts2}</optgroup>` : '';
  }).join('');
  const subjectChapters = Array.from(new Set(fichesOf(initialSubject).map(o=>o.chapter).filter(Boolean)));
  const chapterDatalist = `<datalist id="chapter-suggestions">${subjectChapters.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;

  return `
    <button class="back-link" onclick="${backTarget}">← Retour</button>
    <div class="form-panel">
      <h1>${editing ? 'Modifier la fiche' : 'Ajouter une fiche'}</h1>
      ${!editing ? `
      <button type="button" class="btn smart-paste-btn" onclick="applyFullPaste()">✨ Coller une fiche complète (contenu + quiz + liens)</button>
      <p class="smart-paste-hint">Fonctionne avec une fiche que Claude t'a donnée au format ### TITRE / ### CHAPITRE / ### CONTENU / ### QUIZ / ### SOURCES / ### LIENS.</p>
      ` : ''}
      <form onsubmit="submitFiche(event)"${editing ? ` data-edit-id="${f.id}"` : ''}>
        <div class="field">
          <label for="f-subject">Matière</label>
          <select id="f-subject" name="subjectId" onchange="lastSubjectId=this.value">${options}</select>
        </div>
        <div class="field">
          <label for="f-title">Titre (facultatif)</label>
          <input type="text" id="f-title" name="titleOverride" placeholder="Laisse vide pour utiliser la première ligne du contenu comme titre" value="${esc(initialTitle)}">
        </div>
        <div class="field">
          <label for="f-chapter">Chapitre (facultatif)</label>
          <input type="text" id="f-chapter" name="chapter" list="chapter-suggestions" placeholder="Ex. : Chapitre 3 — Les dérivées" value="${esc(initialChapter)}">
          ${chapterDatalist}
        </div>
        <div class="field">
          <label for="f-tags">Étiquettes (facultatif, séparées par des virgules)</label>
          <input type="text" id="f-tags" name="tags" placeholder="Ex. : important, oral, formule" value="${esc(initialTags.join(', '))}">
        </div>
        <div class="field">
          <label for="f-raw">Contenu de la fiche</label>
          <div class="paste-row">
            <button type="button" class="btn ghost small" onclick="pasteFromClipboard()">📋 Coller depuis le presse-papiers</button>
          </div>
          <textarea id="f-raw" name="content" placeholder="Colle ou écris le contenu de ta fiche ici. Astuce : **gras**, lignes commençant par - pour une liste, $x^2$ pour une formule.">${esc(initialContent)}</textarea>
        </div>
        <div class="field">
          <label>Photos, fichiers ou audio (facultatif, plusieurs possibles)</label>
          <div class="attach-row">
            <button type="button" class="btn ghost small" onclick="document.getElementById('photo-input').click()">📷 Ajouter une photo</button>
            <button type="button" class="btn ghost small" onclick="document.getElementById('file-input').click()">📎 Ajouter un fichier</button>
            <button type="button" class="btn ghost small" id="record-btn" onclick="toggleRecording()">🎤 Enregistrer un audio</button>
          </div>
          <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhotoInput(event)">
          <input type="file" id="file-input" accept="image/*,.pdf" style="display:none" onchange="handleFileInput(event)">
          <div id="attachment-preview" class="attach-preview-list">${attachmentPreviewHtml()}</div>
        </div>
        <div class="field">
          <label for="f-quiz">Questions de quiz (facultatif)</label>
          <textarea id="f-quiz" name="quiz" placeholder="Une question par ligne, réponse après une barre verticale. Ex. : Capitale de la France ? | Paris" style="min-height:90px;">${esc(initialQuiz)}</textarea>
        </div>
        <div class="field">
          <label for="f-sources">Sources (facultatif)</label>
          <input type="text" id="f-sources" name="sources" placeholder="Ex. : Manuel p.42, cours du 12/03" value="${esc(initialSources)}">
        </div>
        <div class="field">
          <label for="f-links">Fiches liées (facultatif, « voir aussi »)</label>
          <select id="f-links" name="links" multiple size="5">${linkOptions}</select>
          <div style="font-size:0.75rem; color:var(--ink-faint); margin-top:4px;">Ctrl/Cmd + clic pour en choisir plusieurs.</div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">${editing ? 'Enregistrer les modifications' : 'Enregistrer la fiche'}</button>
          <button type="button" class="btn ghost" onclick="${backTarget}">Annuler</button>
        </div>
      </form>

    </div>
  `;
}

function renderManageSubjects(){
  const active = activeSubjects();
  const archived = data.subjects.filter(s=>s.archived);
  const rows = active.map((s,i)=>{
    const count = fichesOf(s.id).length;
    return `<div class="manage-row" draggable="true" ondragstart="handleDragStart('${s.id}')" ondragover="handleDragOver(event)" ondrop="handleDrop(event,'${s.id}')">
      <span class="drag-handle" title="Glisser pour réordonner">⠿</span>
      <span class="swatch" style="background:${s.color}"></span>
      <span class="manage-name">${pad2(i+1)}. ${s.emoji ? esc(s.emoji)+' ' : ''}${esc(s.name)} <span class="manage-count">(${count} fiche${count===1?'':'s'})</span></span>
      <div class="manage-actions">
        <button type="button" class="btn ghost small" onclick="moveSubject('${s.id}',-1)" ${i===0?'disabled':''} aria-label="Monter dans l'ordre">↑</button>
        <button type="button" class="btn ghost small" onclick="moveSubject('${s.id}',1)" ${i===active.length-1?'disabled':''} aria-label="Descendre dans l'ordre">↓</button>
        <button type="button" class="btn ghost small" onclick="openEditSubject('${s.id}')">Renommer</button>

        <button type="button" class="btn ghost small" onclick="deleteSubject('${s.id}')">Supprimer</button>
      </div>
    </div>`;
  }).join('');
  const archivedRows = archived.map(s=>{
    const count = fichesOf(s.id).length;
    return `<div class="manage-row">
      <span class="swatch" style="background:${s.color}"></span>
      <span class="manage-name">${s.emoji ? esc(s.emoji)+' ' : ''}${esc(s.name)} <span class="manage-count">(${count} fiche${count===1?'':'s'})</span></span>
      <div class="manage-actions">
        <button type="button" class="btn ghost small" onclick="toggleArchiveSubject('${s.id}')">📤 Désarchiver</button>
        <button type="button" class="btn ghost small" onclick="deleteSubject('${s.id}')">Supprimer</button>
      </div>
    </div>`;
  }).join('');
  return `
    <button class="back-link" onclick="goHome()">← Retour</button>
    <div class="form-panel" style="max-width:760px;">
      <h1>Gérer les matières</h1>

}

// ---------- Glisser pour supprimer (mobile) ----------
let swipeStartX = null;
let swipeCardEl = null;
document.addEventListener('touchstart', (e)=>{
  const card = e.target.closest('.fiche-card');
  if(!card) return;
  swipeStartX = e.touches[0].clientX;
  swipeCardEl = card;
  swipeCardEl.style.transition = 'none';
}, {passive:true});
document.addEventListener('touchmove', (e)=>{
  if(!swipeCardEl || swipeStartX===null) return;
  const dx = e.touches[0].clientX - swipeStartX;
  if(dx < 0){
    swipeCardEl.style.transform = `translateX(${Math.max(dx,-110)}px)`;
    swipeCardEl.style.opacity = String(Math.max(0.3, 1 + dx/220));
  }
}, {passive:true});
document.addEventListener('touchend', ()=>{
  if(!swipeCardEl){ swipeStartX = null; return; }
  const match = /translateX\((-?\d+(?:\.\d+)?)px\)/.exec(swipeCardEl.style.transform || '');
  const dx = match ? parseFloat(match[1]) : 0;
  const card = swipeCardEl;
  card.style.transition = 'transform 150ms ease, opacity 150ms ease';
  if(dx < -70){
    const id = card.getAttribute('data-fiche-id');
    card.style.transform = 'translateX(-100%)';
    card.style.opacity = '0';
    setTimeout(()=>{ if(id) deleteFiche(id); }, 140);
  }else{
    card.style.transform = '';
    card.style.opacity = '';
  }
  swipeStartX = null;
  swipeCardEl = null;
});
