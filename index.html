<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Fiches de Raphaël</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6B5645">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes Fiches">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Parisienne&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --paper: #F3EADC;
    --paper-card: #FDF9F1;
    --ink: #2B2019;
    --ink-soft: #7A6A58;
    --ink-faint: #A8967E;
    --border: #E2D2B8;
    --accent: #C1452A;
    --accent-soft: #E7CBBE;
    --brown-block: #6B5645;
    --radius: 12px;
    --shadow: 0 2px 4px rgba(43,32,25,0.07), 0 8px 20px rgba(43,32,25,0.07);
  }
  [data-theme="dark"]{
    --paper: #1E1710;
    --paper-card: #2A2119;
    --ink: #F3EADC;
    --ink-soft: #C9BBA8;
    --ink-faint: #8C7C68;
    --border: #453824;
    --accent: #E37650;
    --accent-soft: #4A3626;
    --shadow: 0 2px 4px rgba(0,0,0,0.25), 0 8px 20px rgba(0,0,0,0.3);
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--paper); color: var(--ink); transition: background 150ms ease, color 150ms ease;
    font-family: 'Poppins', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .display{ font-family:'Anton', sans-serif; text-transform:uppercase; letter-spacing:0.5px; }
  .script{ font-family:'Parisienne', cursive; text-transform:none; letter-spacing:0; }
  button, input, select, textarea{ font-family: inherit; }
  a{ color: inherit; }

  .layout{ display:flex; min-height:100vh; align-items:stretch; }

  /* ---------- Rail ---------- */
  .rail{
    width: 270px; flex-shrink:0; background: var(--paper); border-right: 1px solid var(--border);
    padding: 30px 18px 20px; display:flex; flex-direction:column; position:relative;
  }
  .rail-brand-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .rail-icon-buttons{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .icon-btn{ background:transparent; border:1.5px solid var(--border); border-radius:6px; width:28px; height:28px;
    cursor:pointer; color: var(--ink-soft); font-size:0.95rem; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .rail-reopen{ position:fixed; top:20px; left:20px; z-index:100; background: var(--ink); color: var(--paper);
    border:none; width:42px; height:42px; border-radius:10px; cursor:pointer; font-size:1.15rem; box-shadow: var(--shadow); }
  .layout.rail-collapsed .main{ max-width:none; }
  .theme-toggle{ background:transparent; border:1.5px solid var(--border); border-radius:8px; width:34px; height:34px;
    font-size:1rem; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .theme-toggle:hover{ border-color: var(--accent); }
  .font-size-control{ display:flex; align-items:center; gap:6px; }
  .font-btn{ background:transparent; border:1.5px solid var(--border); border-radius:6px; width:26px; height:26px;
    cursor:pointer; color: var(--ink-soft); font-size:0.72rem; font-weight:700; }
  .font-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .font-size-value{ font-size:0.68rem; color: var(--ink-faint); min-width:32px; text-align:center; }
  .brand{ font-size:1.5rem; line-height:1.05; margin-bottom:4px; }
  .brand .script{ font-size:1.5rem; color: var(--accent); display:block; margin-top:-4px; }
  .rail-sub{ font-size:0.68rem; letter-spacing:1px; color: var(--ink-faint); text-transform:uppercase; margin-bottom:14px; }

  .rail-top{ }
  .rail-nav{ display:flex; flex-direction:column; flex:1; min-height:0; }

  .rail-search{ margin-bottom:14px; }
  .rail-search input{ width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:8px;
    background: var(--paper-card); font-size:0.85rem; color: var(--ink); }
  .rail-search input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .home-row{
    background:transparent; border:none; text-align:left; cursor:pointer; width:100%;
    padding:10px 8px; font-weight:600; font-size:0.92rem; color: var(--ink-soft);
    border-bottom:1px solid var(--border); margin-bottom:10px; transition: color 150ms ease;
  }
  .home-row:hover{ color: var(--ink); }
  .home-row.active{ color: var(--ink); font-weight:700; }

  .rail-subjects{ display:flex; flex-direction:column; overflow-y:auto; flex:1; }
  .tab{
    border:none; cursor:pointer; text-align:left; display:flex; align-items:center; gap:9px;
    width:100%; padding:11px 9px; background:transparent; color: var(--ink);
    border-bottom:1px solid var(--border); transition: transform 150ms ease, background 150ms ease, padding 150ms ease;
  }
  .tab-badge{
    font-family:'Anton', sans-serif; font-size:0.72rem; background: var(--ink); color: var(--paper);
    width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .tab-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .tab-name{ font-size:0.86rem; font-weight:600; flex:1; line-height:1.2; }
  .tab-count{ font-size:0.72rem; color: var(--ink-faint); flex-shrink:0; }
  .tab:hover{ background: var(--paper-card); }
  .tab.active{
    background: var(--tab-color); color: var(--tab-text); border-radius: 8px; border-bottom-color: transparent;
    transform: translateX(4px); box-shadow: var(--shadow); margin: 2px 0;
  }
  .tab.active .tab-badge{ background: rgba(255,255,255,0.28); color: var(--tab-text); }
  .tab.active .tab-count{ color: var(--tab-text); opacity:0.85; }

  .add-subject-btn{
    margin-top:16px; background:transparent; border:1.5px dashed var(--ink-faint); color: var(--ink-soft);
    padding:10px 12px; border-radius:8px; cursor:pointer; font-size:0.8rem; text-align:left; font-weight:600;
    transition: border-color 150ms ease, color 150ms ease;
  }
  .add-subject-btn:hover{ border-color: var(--accent); color: var(--accent); }

  /* ---------- Main ---------- */
  .main{ flex:1; padding: 54px 58px; max-width: 960px; position:relative; }
  .eyebrow{ font-size:0.72rem; letter-spacing:1.5px; text-transform:uppercase; color: var(--ink-faint);
    font-weight:600; margin:0 0 12px; }
  h1.hero{ font-size:3.1rem; line-height:0.98; margin:0; }
  h1.hero .script{ font-size:2.5rem; display:block; margin-top:2px; }
  .lede{ font-size:1rem; color: var(--ink-soft); max-width:56ch; line-height:1.6; margin: 20px 0 20px; }
  .doodle-corner{ position:absolute; top:36px; right:50px; opacity:0.9; }

  .resume-card{ display:inline-flex; align-items:center; gap:8px; background: var(--paper-card);
    border:1.5px solid var(--border); border-radius:999px; padding:9px 18px; font-size:0.86rem;
    cursor:pointer; margin-bottom:26px; box-shadow: var(--shadow); }
  .resume-label{ font-weight:700; color: var(--accent); text-transform:uppercase; font-size:0.68rem; letter-spacing:0.4px; }

  .stats-row{ display:flex; gap:36px; margin-bottom:38px; }
  .stat .num{ font-family:'Anton', sans-serif; font-size:2rem; color: var(--accent); line-height:1; }
  .stat .label{ font-size:0.72rem; letter-spacing:0.5px; text-transform:uppercase; color: var(--ink-faint); margin-top:4px; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:16px; margin-bottom:42px; }
  .subject-card{
    background: var(--paper-card); border:2.5px solid var(--border); border-radius: var(--radius);
    padding:16px 18px; cursor:pointer; box-shadow: var(--shadow); transition: transform 150ms ease, rotate 150ms ease;
    rotate: var(--rot, -0.6deg);
  }
  .subject-card:nth-child(even){ --rot: 0.6deg; }
  .subject-card:hover{ transform: translateY(-3px); rotate: 0deg; }
  .card-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .swatch{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .subject-card .name{ font-weight:700; font-size:0.96rem; }
  .subject-card .count{ font-size:0.76rem; color: var(--ink-soft); }

  .howitworks{ background: var(--paper-card); border-top:3px solid var(--ink); border-radius: 4px var(--radius) var(--radius) var(--radius); padding:24px 26px; margin-bottom: 30px; box-shadow: var(--shadow); }
  .howitworks h2{ font-size:1.15rem; margin:0 0 6px; font-weight:700; }
  .howitworks .underline{ display:block; width:120px; height:8px; margin:-4px 0 14px; }
  .howitworks ol{ margin:0; padding-left:20px; }
  .howitworks li{ margin-bottom:10px; color: var(--ink-soft); font-size:0.9rem; line-height:1.55; }
  .howitworks li b{ color: var(--ink); }
  .howitworks .note{ font-size:0.8rem; color: var(--ink-faint); margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }

  .footer-link{ font-size:0.76rem; color: var(--ink-faint); background:none; border:none; cursor:pointer; padding:0; text-decoration:underline; }
  .backup-row{ margin-top:18px; display:flex; gap:18px; flex-wrap:wrap; align-items:center; }

  /* Subject view */
  .subject-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:14px; }
  .subject-header h1{ font-size:2.2rem; margin:0; display:flex; align-items:center; gap:12px; }
  .subject-header .swatch-lg{ width:20px; height:20px; border-radius:6px; }
  .subject-header .meta{ font-size:0.78rem; color: var(--ink-soft); margin-top:4px; }
  .btn{
    background: var(--accent); color:#FDF9F1; border:none; padding:11px 20px; border-radius:8px;
    font-weight:700; font-size:0.86rem; cursor:pointer; transition: opacity 150ms ease; font-family:'Poppins',sans-serif;
  }
  .btn:hover{ opacity:0.87; }
  .btn.ghost{ background:transparent; color: var(--ink); border:1.5px solid var(--border); }
  .btn.small{ padding:8px 14px; font-size:0.78rem; }

  .empty-state{ border:2px dashed var(--border); border-radius: var(--radius); padding:44px 30px; text-align:center; color: var(--ink-soft); background: var(--paper-card); }
  .empty-state p{ margin:0 0 20px; font-size:0.94rem; }

  .fiche-card{
    background: var(--paper-card); border:2.5px solid var(--border); border-radius: var(--radius); padding:16px 18px;
    cursor:pointer; box-shadow: var(--shadow); transition: transform 150ms ease, rotate 150ms ease;
    rotate: var(--rot, -0.5deg);
  }
  .fiche-card:nth-child(even){ --rot: 0.5deg; }
  .fiche-card:hover{ transform: translateY(-3px); rotate:0deg; }
  .fiche-card .title{ font-weight:700; font-size:0.98rem; margin-bottom:4px; }
  .fiche-card .date{ font-size:0.72rem; color: var(--ink-faint); text-transform:uppercase; letter-spacing:0.4px; }
  .fiche-card .preview{ font-size:0.84rem; color: var(--ink-soft); margin-top:8px; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

  /* Fiche detail */
  .back-link{ background:none; border:none; cursor:pointer; color: var(--ink-soft); font-size:0.85rem;
    padding:0; margin-bottom:20px; display:inline-flex; align-items:center; gap:6px; font-weight:600; }
  .back-link:hover{ color: var(--accent); }
  .fiche-detail{ background: var(--paper-card); border:1px solid var(--border); border-radius: var(--radius); padding:36px 40px; box-shadow: var(--shadow); }
  .fiche-detail .fiche-title{ font-size:2rem; margin:0 0 8px; }
  .fiche-detail .fiche-date{ font-size:0.75rem; color: var(--ink-faint); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  .fiche-content{ line-height:1.65; font-size:0.96rem; margin-top:18px; }
  .fiche-attachments{ display:flex; flex-direction:column; gap:14px; margin:16px 0; }
  .fiche-attachment{ margin:0; }
  .fiche-attachment img{ max-width:100%; border-radius: var(--radius); border:1px solid var(--border); display:block; }
  .fiche-attachment audio{ width:100%; }
  .fiche-actions{ margin-top:30px; padding-top:20px; border-top:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; }

  .linked-fiches{ margin-top:24px; padding-top:18px; border-top:1px solid var(--border); }
  .fiche-sources{ font-size:0.8rem; color: var(--ink-faint); font-style:italic; margin:16px 0 0; }
  .print-sources{ font-size:0.8rem; color:#555; font-style:italic; margin-top:14px; }
  .card-tags{ margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
  .tag-chip-mini{ font-size:0.68rem; background: var(--paper); border:1px solid var(--border); color: var(--ink-faint);
    padding:2px 8px; border-radius:999px; }
  .fiche-tags{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .tag-chip{ font-size:0.75rem; background: var(--paper); border:1.5px solid var(--border); color: var(--ink-soft);
    padding:4px 12px; border-radius:999px; cursor:pointer; }
  .tag-chip:hover{ border-color: var(--accent); color: var(--accent); }
  .linked-label{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.6px; color: var(--ink-faint); margin-bottom:10px; font-weight:700; }
  .link-chip{ display:inline-block; background: var(--paper); border:1.5px solid var(--border); color: var(--ink);
    padding:7px 14px; border-radius:999px; font-size:0.82rem; cursor:pointer; margin:0 8px 8px 0; }
  .link-chip:hover{ border-color: var(--accent); color: var(--accent); }

  .history-section{ margin-top:24px; padding-top:18px; border-top:1px solid var(--border); }
  .history-section summary{ cursor:pointer; font-size:0.8rem; font-weight:700; color: var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.4px; }
  .history-item{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--border); }
  .history-item:last-child{ border-bottom:none; }
  .history-date{ font-size:0.72rem; color: var(--ink-faint); white-space:nowrap; }
  .history-title{ flex:1; font-size:0.86rem; color: var(--ink-soft); }

  .connection-result{ font-size:0.78rem; color: var(--ink-soft); margin-top:10px; }

  .attach-preview-list{ display:flex; flex-direction:column; gap:8px; }

  /* Forms */
  .form-panel{ background: var(--paper-card); border:1px solid var(--border); border-radius: var(--radius); padding:32px 36px; max-width:640px; box-shadow: var(--shadow); }
  .form-panel h1{ font-size:1.7rem; margin:0 0 22px; }
  .smart-paste-btn{ width:100%; margin-bottom:6px; background: var(--brown-block); }
  .smart-paste-hint{ font-size:0.75rem; color: var(--ink-faint); margin:0 0 22px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.78rem; font-weight:700; color: var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px; }
  .field select[multiple]{ min-height:110px; }
  .field input[type=text], .field select, .field textarea{
    width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:8px; font-size:0.92rem;
    background: var(--paper); color: var(--ink); font-family:'Poppins', sans-serif;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field textarea{ min-height:260px; resize:vertical; line-height:1.5; }
  .paste-row{ margin-bottom:10px; }
  .attach-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .attach-chip{ display:flex; align-items:center; gap:10px; background: var(--paper); border:1.5px solid var(--border);
    border-radius:8px; padding:8px 12px; margin-top:4px; }
  .attach-chip img{ max-height:70px; border-radius:6px; display:block; }
  .swatch-picker{ display:flex; gap:9px; flex-wrap:wrap; }
  .swatch-option{ width:32px; height:32px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch-option.selected{ border-color: var(--ink); }
  .form-actions{ display:flex; gap:10px; margin-top:26px; }

  .manage-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .manage-row{ display:flex; align-items:center; gap:10px; padding:12px 14px; border:1.5px solid var(--border);
    border-radius:8px; background: var(--paper); flex-wrap:wrap; }
  .manage-name{ flex:1; font-weight:600; font-size:0.9rem; }
  .manage-count{ color: var(--ink-faint); font-weight:400; font-size:0.8rem; }
  .manage-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .manage-actions .btn[disabled]{ opacity:0.35; cursor:not-allowed; }
  .drag-handle{ cursor:grab; color: var(--ink-faint); font-size:1.1rem; padding:0 2px; }
  .manage-row[draggable="true"]:active{ cursor:grabbing; }

  .sort-filter-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .sort-filter-row select{ padding:8px 10px; border:1.5px solid var(--border); border-radius:8px;
    background: var(--paper-card); color: var(--ink); font-size:0.82rem; }
  .chapter-heading{ font-family:'Anton', sans-serif; font-size:1rem; letter-spacing:0.4px; text-transform:uppercase;
    color: var(--ink-soft); margin:26px 0 12px; padding-bottom:6px; border-bottom:1.5px solid var(--border); }
  .chapter-heading:first-of-type{ margin-top:0; }

  /* Fiche du jour */
  .day-fiche-card{ background: var(--brown-block); color:#FDF9F1; border-radius: var(--radius); padding:14px 20px;
    margin-bottom:26px; cursor:pointer; box-shadow: var(--shadow); flex:1; min-width:200px; }
  .day-fiche-label{ font-size:0.68rem; text-transform:uppercase; letter-spacing:1px; opacity:0.85; margin-bottom:4px; }
  .day-fiche-title{ font-weight:700; font-size:1.02rem; }

  /* Rappel doux */
  .reminder-card{ background: var(--paper-card); border-left:4px solid var(--accent); border-radius:8px;
    padding:14px 18px; margin-bottom:22px; }
  .reminder-label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color: var(--accent);
    font-weight:700; margin-bottom:6px; }
  .reminder-line{ font-size:0.88rem; color: var(--ink-soft); margin-bottom:4px; }
  .reminder-line b{ color: var(--ink); }

  /* Graphique hebdomadaire */
  .weekly-chart{ display:flex; align-items:flex-end; gap:10px; height:130px; padding-top:10px; }
  .chart-bar-wrap{ display:flex; flex-direction:column; align-items:center; flex:1; }
  .chart-bar{ width:100%; max-width:28px; background: var(--accent); border-radius:4px 4px 0 0; min-height:4px; }
  .chart-bar-label{ font-size:0.62rem; color: var(--ink-faint); margin-top:6px; white-space:nowrap; }

  /* Objectif hebdomadaire */
  .goal-row{ margin-bottom:14px; }
  .goal-bar-track{ background: var(--paper); border:1px solid var(--border); border-radius:999px; height:14px; overflow:hidden; margin-bottom:8px; }
  .goal-bar-fill{ background: var(--accent); height:100%; border-radius:999px; transition:width 300ms ease; }
  .goal-text{ font-size:0.82rem; color: var(--ink-soft); }
  .goal-edit{ display:flex; align-items:center; gap:8px; font-size:0.85rem; flex-wrap:wrap; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; font-size:0.88rem; color: var(--ink-soft); flex-wrap:wrap; }
  .settings-row:last-child{ margin-bottom:0; }
  .goal-edit input{ width:64px; padding:6px 8px; border:1.5px solid var(--border); border-radius:6px; background: var(--paper); color: var(--ink); }

  /* Flashcards & quiz */
  .flashcard-progress{ font-size:0.8rem; color: var(--ink-faint); margin-bottom:14px; text-align:center; }
  .flashcard{ background: var(--paper-card); border:1px solid var(--border); border-radius: var(--radius);
    padding:44px 36px; text-align:center; box-shadow: var(--shadow); min-height:180px; }
  .flashcard-title{ font-size:1.5rem; margin:0 0 20px; }
  .flashcard .fiche-content{ text-align:left; margin-top:16px; }
  .flashcard .fiche-attachment{ text-align:left; }
  .flashcard-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:24px; }

  /* Minuteur */
  .pomodoro-modes{ display:flex; gap:10px; margin-bottom:24px; }
  .pomodoro-display{ text-align:center; background: var(--paper-card); border:1px solid var(--border);
    border-radius: var(--radius); padding:50px 20px; margin-bottom:24px; box-shadow: var(--shadow); }
  .pomodoro-time{ font-family:'Anton', sans-serif; font-size:4rem; color: var(--accent); line-height:1; }
  .pomodoro-label{ color: var(--ink-soft); margin-top:10px; text-transform:uppercase; font-size:0.8rem; letter-spacing:1px; }

<script>

const DEFAULT_SUBJECTS = [
  {id:'math-spe', name:'Maths spé',                 code:'MA+',  color:'#B8452A', textColor:'#FDF9F1'},
  {id:'pc-spe',   name:'Physique-Chimie spé',        code:'PC+',  color:'#B8630B', textColor:'#FDF9F1'},

  {id:'hg',       name:'Histoire-Géographie',        code:'HG',   color:'#7A4A2E', textColor:'#FDF9F1'},
  {id:'sci',      name:'Enseignement scientifique',  code:'SCI',  color:'#97701F', textColor:'#FDF9F1'},
  {id:'math',     name:'Mathématiques',               code:'MATH', color:'#9C5548', textColor:'#FDF9F1'},
  {id:'fr',       name:'Français',                    code:'FR',   color:'#6B2530', textColor:'#FDF9F1'},
  {id:'ang',      name:'Anglais',                      code:'ANG',  color:'#85583A', textColor:'#FDF9F1'},
  {id:'ita',      name:'Italien',                      code:'ITA',  color:'#5B6636', textColor:'#FDF9F1'},
  {id:'lat',      name:'Latin',                        code:'LAT',  color:'#5C4F44', textColor:'#FDF9F1'}
];

const SWATCHES = ['#B8452A','#B8630B','#3F5D4E','#5E4256','#7A4A2E','#97701F','#6E7C4A','#5C4F44'];

let data = { subjects: DEFAULT_SUBJECTS.map(s=>({...s})), fiches: [] };
let state = { view: 'home' };
let dataLoaded = false;
let lastSubjectId = null;
let pickedColor = SWATCHES[0];
let pendingAttachments = [];
let syncStatus = 'idle';
let lastDeleted = null;
let mergePanelOpen = false;
function toggleMergePanel(){ mergePanelOpen = !mergePanelOpen; render(); }

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function migrateAttachments(f){
  if(!f) return [];
  if(Array.isArray(f.attachments)) return f.attachments;
  if(f.attachment) return [f.attachment];
  return [];
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function inlineFormat(s){ return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function isTableRow(line){ return /^\s*\|.*\|\s*$/.test(line); }
function isTableSep(line){ return /^\s*\|?[\s:|-]+\|?\s*$/.test(line) && line.includes('-'); }

function renderMarkdownLite(text){
  const escaped = esc(text);
  const lines = escaped.split('\n');
  let html = '';
  let inList = false;
  const flushList = () => { if(inList){ html += '</ul>'; inList = false; } };
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    const ytMatch = line.trim().match(/^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})\S*$/i);
    if(ytMatch){
      flushList();
      html += `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${ytMatch[1]}" title="Vidéo YouTube" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
      i++; continue;
    }
    if(isTableRow(line) && i+1<lines.length && isTableSep(lines[i+1])){
      flushList();
      const rows = [line];
      i += 2;
      while(i<lines.length && isTableRow(lines[i])){ rows.push(lines[i]); i++; }
      html += '<table class="md-table">' + rows.map((row,idx)=>{
        const cells = row.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
        const tag = idx===0 ? 'th' : 'td';
        return '<tr>' + cells.map(c=>`<${tag}>${inlineFormat(c)}</${tag}>`).join('') + '</tr>';
      }).join('') + '</table>';
      continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      if(!inList){ html += '<ul>'; inList = true; }
      html += '<li>' + inlineFormat(line.replace(/^\s*[-*]\s+/, '')) + '</li>';
      i++; continue;
    }
    flushList();
    if(line.trim() !== ''){ html += '<p>' + inlineFormat(line) + '</p>'; }
    i++;
  }
  flushList();
  return html;
}

function renderMathIn(selector){
  if(!window.renderMathInElement) return;
  document.querySelectorAll(selector).forEach(el=>{
    try{
      renderMathInElement(el, {
        delimiters: [
          {left:'$$', right:'$$', display:true},
          {left:'$', right:'$', display:false}
        ],
        throwOnError:false
      });
    }catch(e){}
  });
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
}
function getSubject(id){ return data.subjects.find(s=>s.id===id); }
function getFiche(id){ return data.fiches.find(f=>f.id===id); }
function fichesOf(subjectId){ return data.fiches.filter(f=>f.subjectId===subjectId).sort((a,b)=> b.dateAdded.localeCompare(a.dateAdded)); }

// ---------- Score de confiance & répétition espacée ----------
const REVIEW_INTERVALS = {1:1, 2:3, 3:7, 4:14, 5:30}; // jours avant la prochaine révision suggérée
function confidenceColor(n){
  return {1:'#A3342A',2:'#C1452A',3:'#B0821F',4:'#7C9A5B',5:'#3F8F5C'}[n] || null;
}
function isDueForReview(f){
  if(f.confidence === undefined) return true;
  if(!f.nextReview) return true;
  return new Date(f.nextReview) <= new Date();
}
function migrateFicheStatus(f){
  if(f.status && f.confidence===undefined){
    f.confidence = f.status==='a-revoir' ? 1 : 5;
    const days = REVIEW_INTERVALS[f.confidence] || 7;
    const next = new Date(); next.setDate(next.getDate()+days);
    f.nextReview = next.toISOString();
  }
  delete f.status;
}
async function setConfidence(id, level){
  const f = getFiche(id);
  if(!f) return;
  if(f.confidence === level){
    f.confidence = undefined;
    f.nextReview = undefined;
  }else{
    f.confidence = level;
    f.reviewCount = (f.reviewCount||0) + 1;
    const days = REVIEW_INTERVALS[level] || 7;
    const next = new Date(); next.setDate(next.getDate()+days);
    f.nextReview = next.toISOString();
  }
  vibrate(15);
  await saveData();
  render();
}
function confidenceRowHtml(f){
  return `<div class="confidence-row">
    <span class="confidence-label">Confiance :</span>
    ${[1,2,3,4,5].map(n=>`<button class="confidence-btn c${n} ${f.confidence===n?'active':''}" onclick="setConfidence('${f.id}',${n})" title="${n}/5">${n}</button>`).join('')}
    ${isDueForReview(f) ? '<span class="due-badge">⏰ à revoir</span>' : ''}
  </div>`;
}

let currentSort = 'date-desc';
let currentFilter = 'all';
function setSort(v){ currentSort = v; render(); }
function setFilter(v){ currentFilter = v; render(); }

function applyFilterSort(list){
  let out = list;
  if(currentFilter==='a-revoir') out = out.filter(f=> isDueForReview(f));
  else if(currentFilter==='maitrisee') out = out.filter(f=> f.confidence!==undefined && f.confidence>=4);
  else if(currentFilter==='sans-statut') out = out.filter(f=> f.confidence===undefined);
  const confRank = f => f.confidence===undefined ? 3 : f.confidence;
  if(currentSort==='date-asc') out = [...out].sort((a,b)=> a.dateAdded.localeCompare(b.dateAdded));
  else if(currentSort==='title-asc') out = [...out].sort((a,b)=> a.title.localeCompare(b.title,'fr'));
  else if(currentSort==='title-desc') out = [...out].sort((a,b)=> b.title.localeCompare(a.title,'fr'));
  else if(currentSort==='status') out = [...out].sort((a,b)=> confRank(a)-confRank(b));
  else if(currentSort==='manuel'){ /* garde l'ordre du tableau data.fiches, ne trie pas */ }
  else out = [...out].sort((a,b)=> (b.dateEdited||b.dateAdded).localeCompare(a.dateEdited||a.dateAdded));
  const pinned = out.filter(f=>f.pinned);
  const rest = out.filter(f=>!f.pinned);
  return [...pinned, ...rest];
}
function visibleFichesOf(subjectId){
  return applyFilterSort(data.fiches.filter(f=>f.subjectId===subjectId));
}
function groupByChapter(list){
  const groups = new Map();
  list.forEach(f=>{
    const key = (f.chapter && f.chapter.trim()) ? f.chapter.trim() : '__none__';
    if(!groups.has(key)) groups.set(key, { label: key==='__none__' ? 'Sans chapitre' : key, fiches: [] });
    groups.get(key).fiches.push(f);
  });
  const entries = [...groups.entries()];
  const named = entries.filter(([k])=>k!=='__none__').map(([,v])=>v);
  const none = groups.get('__none__');
  return none ? [...named, none] : named;
}

function renderFicheCard(f, opts){
  opts = opts || {};
  const preview = esc(f.content).slice(0,140);
  const atts = migrateAttachments(f);
  const attachIcon = atts.length ? (atts.some(a=>a.type==='image') ? ' 🖼️' : atts.some(a=>a.type==='audio') ? ' 🎤' : ' 📎') : '';
  const confDot = f.confidence !== undefined ? `<span class="conf-dot" style="background:${confidenceColor(f.confidence)}" title="Confiance ${f.confidence}/5"></span>` : '';
  const pin = f.pinned ? '📌 ' : '';
  let dateLine = fmtDate(f.dateAdded);
  if(opts.showSubject){ const s = getSubject(f.subjectId); dateLine = (s ? esc(s.name)+' · ' : '') + dateLine; }
  const seen = timeAgo(f.lastViewed);
  if(seen) dateLine += ' · ' + seen;
  const tagsHtml = (f.tags && f.tags.length) ? `<div class="card-tags">${f.tags.map(t=>`<span class="tag-chip-mini">${esc(t)}</span>`).join('')}</div>` : '';
  const draggable = currentSort==='manuel' ? `draggable="true" ondragstart="handleFicheDragStart('${f.id}')" ondragover="handleFicheDragOver(event)" ondrop="handleFicheDrop(event,'${f.id}')"` : '';
  return `<div class="fiche-card" data-fiche-id="${f.id}" ${draggable} tabindex="0" onclick="openFiche('${f.id}')" onkeypress="if(event.key==='Enter') openFiche('${f.id}')">
    <div class="title">${pin}${confDot}${esc(f.title)}${attachIcon}</div>
    <div class="date">${dateLine}</div>
    <div class="preview">${preview}</div>
    ${tagsHtml}
  </div>`;
}
function subjectIndex(id){ return data.subjects.findIndex(s=>s.id===id); }
function pad2(n){ return String(n).padStart(2,'0'); }
function activeSubjects(){ return data.subjects.filter(s=>!s.archived); }
function activeRank(id){ return activeSubjects().findIndex(s=>s.id===id); }

// ---------- Glisser-déposer des fiches (tri manuel) ----------
let dragFicheId = null;
function handleFicheDragStart(id){ dragFicheId = id; }
function handleFicheDragOver(ev){ ev.preventDefault(); }
async function handleFicheDrop(ev, targetId){
  ev.preventDefault();
  if(!dragFicheId || dragFicheId===targetId){ dragFicheId=null; return; }
  const fromIdx = data.fiches.findIndex(f=>f.id===dragFicheId);
  const toIdx = data.fiches.findIndex(f=>f.id===targetId);
  dragFicheId = null;
  if(fromIdx<0 || toIdx<0) return;
  const [moved] = data.fiches.splice(fromIdx,1);
  data.fiches.splice(toIdx,0,moved);
  await saveData();
  render();
}

// ---------- Archivage d'une matière ----------
async function toggleArchiveSubject(id){
  const s = getSubject(id);
  if(!s) return;
  s.archived = !s.archived;
  await saveData();
  render();
}

// ---------- Étiquettes ----------
function allTags(){
  const set = new Set();
  data.fiches.forEach(f=> (f.tags||[]).forEach(t=>set.add(t)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr'));
}
function openTagView(tag){ state = { view: {type:'tag', tag} }; render(); }
function renderTagView(tag){
  const list = data.fiches.filter(f=> (f.tags||[]).some(t=>t.toLowerCase()===tag.toLowerCase()));
  const cardsHtml = list.map(f=>renderFicheCard(f,{showSubject:true})).join('');
  return `
    <p class="eyebrow">Étiquette</p>
    <h1 class="hero" style="font-size:2rem;">🏷️ ${esc(tag)}</h1>
    ${list.length ? `<div class="grid" style="margin-top:26px;">${cardsHtml}</div>` : `<div class="empty-state" style="margin-top:26px;"><p>Aucune fiche avec cette étiquette.</p></div>`}
  `;
}

// ---------- Fusionner deux fiches ----------
async function mergeFicheInto(sourceId, targetId){
  const source = getFiche(sourceId);
  const target = getFiche(targetId);
  if(!source || !target || source.id===target.id) return;
  if(!confirm(`Fusionner « ${source.title} » dans « ${target.title} » ? La fiche « ${source.title} » sera supprimée après fusion.`)) return;
  target.content = target.content + '\n\n---\n\n**' + source.title + '**\n' + source.content;
  target.dateEdited = new Date().toISOString();
  data.fiches = data.fiches.filter(f=>f.id!==source.id);
  await saveData();
  openFiche(target.id);
}
function renderAttachmentsGallery(f){
  const atts = migrateAttachments(f);
  if(!atts.length) return '';
  return `<div class="fiche-attachments">${atts.map(a=>{
    const src = a.url || a.dataUrl;
    if(a.type==='image') return `<div class="fiche-attachment"><img src="${src}" alt=""></div>`;
    if(a.type==='audio') return `<div class="fiche-attachment"><audio controls src="${src}"></audio></div>`;
    return `<div class="fiche-attachment"><a href="${src}" target="_blank" rel="noopener" download="${esc(a.name)}" class="btn ghost small">📎 ${esc(a.name)} — Ouvrir / Télécharger</a></div>`;
  }).join('')}</div>`;
}
function splitTitleContent(raw){
  const lines = raw.split('\n');
  const title = (lines[0] || '').trim().slice(0,120) || 'Sans titre';
  const rest = lines.slice(1).join('\n').trim();
  return { title, content: rest || raw.trim() };
}
function mostRecentFiche(){
  if(!data.fiches.length) return null;
  return [...data.fiches].sort((a,b)=> (b.dateEdited||b.dateAdded).localeCompare(a.dateEdited||a.dateAdded))[0];
}
function toSyncPayload(d){
  // On n'envoie jamais le dataUrl (trop lourd) : seulement la référence en ligne (url),
  // une fois que la pièce jointe a été effectivement mise en ligne sur Supabase Storage.
  return {
    subjects: d.subjects,
    fiches: d.fiches.map(f=>{
      const { attachment, attachments, ...rest } = f;
      const list = migrateAttachments(f).filter(a=>a.url).map(a=>({type:a.type, name:a.name, mime:a.mime, url:a.url}));
      return list.length ? { ...rest, attachments: list } : rest;
    })
  };
}

// ---------- Stockage local + cloud (Supabase) ----------
async function cloudLoad(){
  if(!sb) return null;
  try{
    const { data: row, error } = await sb.from('app_data').select('payload').eq('id', 1).maybeSingle();
    if(error || !row) return null;
    return row.payload || null;
  }catch(e){ console.log('Sync cloud indisponible', e); return null; }
}

async function cloudSave(payload){
  if(!sb) return;
  try{
    const { error } = await sb.from('app_data').upsert({ id: 1, payload });
    setSyncStatus(error ? 'offline' : 'ok');
  }catch(e){
    console.log('Sync cloud impossible pour le moment', e);
    setSyncStatus('offline');
  }
}

async function uploadAttachmentsIfNeeded(fiche){
  if(!sb) return;
  const list = migrateAttachments(fiche);
  if(!list.length) return;
  for(const att of list){
    if(att.url || !att.dataUrl) continue;
    try{
      const res = await fetch(att.dataUrl);
      const blob = await res.blob();
      const ext = (att.mime && att.mime.split('/')[1]) || 'bin';
      const path = `${fiche.id}-${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
      const { error } = await sb.storage.from('attachments').upload(path, blob, { contentType: att.mime, upsert: true });
      if(error){ console.log('Upload pièce jointe échoué', error); continue; }
      const { data: pub } = sb.storage.from('attachments').getPublicUrl(path);
      att.url = pub.publicUrl;
    }catch(e){ console.log('Upload pièce jointe impossible', e); }
  }
  fiche.attachments = list;
  delete fiche.attachment;
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.subjects) && Array.isArray(parsed.fiches)) data = parsed;
    }
  }catch(e){
    // Rien de valide en local : on garde les valeurs par défaut.
  }

  const cloud = await cloudLoad();
  if(cloud && Array.isArray(cloud.subjects) && Array.isArray(cloud.fiches)){
    const localFichesById = new Map(data.fiches.map(f=>[f.id,f]));
    const mergedSubjectsById = new Map(data.subjects.map(s=>[s.id,s]));
    cloud.subjects.forEach(s => mergedSubjectsById.set(s.id, s));
    const mergedFichesById = new Map();
    cloud.fiches.forEach(cf => {
      const local = localFichesById.get(cf.id);
      const cloudAtts = migrateAttachments(cf);
      const localAtts = migrateAttachments(local);
      let merged = cf;
      if(cloudAtts.length || localAtts.length){
        const mergedAtts = cloudAtts.map(ca=>{
          const match = localAtts.find(la=> !la.url && la.name===ca.name && la.mime===ca.mime);
          return match ? { ...ca, dataUrl: match.dataUrl } : ca;
        });
        localAtts.forEach(la=>{
          if(!la.url && !mergedAtts.some(ma=>ma.dataUrl===la.dataUrl)) mergedAtts.push(la);
        });
        merged = { ...cf };
        delete merged.attachment;
        merged.attachments = mergedAtts;
      }
      mergedFichesById.set(cf.id, merged);
    });
    data.fiches.forEach(lf => { if(!mergedFichesById.has(lf.id)) mergedFichesById.set(lf.id, lf); });
    data = { subjects: Array.from(mergedSubjectsById.values()), fiches: Array.from(mergedFichesById.values()) };
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }

  data.fiches.forEach(migrateFicheStatus);
  dataLoaded = true;
  render();

  if(sb){
    for(const f of data.fiches){ await uploadAttachmentsIfNeeded(f); }
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
    cloudSave(toSyncPayload(data));
  }
}

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    alert("La sauvegarde a échoué (stockage local plein ou bloqué par le navigateur).");
  }
  if(sb){
    for(const f of data.fiches){ await uploadAttachmentsIfNeeded(f); }
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }
  cloudSave(toSyncPayload(data));
}

// ---------- Minuteur Pomodoro ----------
let pomodoroState = { running:false, seconds:25*60, mode:'travail', intervalId:null };
function formatPomodoroTime(total){
  const m = Math.floor(total/60), s = total%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function tickPomodoro(){
  pomodoroState.seconds--;
  const el = document.getElementById('pomodoro-time');
  if(el) el.textContent = formatPomodoroTime(pomodoroState.seconds);
  if(pomodoroState.seconds<=0){
    clearInterval(pomodoroState.intervalId);
    pomodoroState.running = false;
    const finishedMode = pomodoroState.mode;
    const nextMode = finishedMode==='travail' ? 'pause' : 'travail';
    pomodoroState.mode = nextMode;
    pomodoroState.seconds = nextMode==='travail' ? 25*60 : 5*60;
    vibrate([100,60,100,60,100]);
    render();
    alert(finishedMode==='travail' ? "Séance terminée — c'est l'heure de la pause !" : "Pause terminée, au travail !");
  }
}
function pomodoroToggle(){
  if(pomodoroState.running){
    clearInterval(pomodoroState.intervalId);
    pomodoroState.running = false;
  }else{
    pomodoroState.running = true;
    pomodoroState.intervalId = setInterval(tickPomodoro, 1000);
  }
  render();
}
function pomodoroReset(){
  clearInterval(pomodoroState.intervalId);
  pomodoroState.running = false;
  pomodoroState.seconds = pomodoroState.mode==='travail' ? 25*60 : 5*60;
  render();
}
function pomodoroSetMode(mode){
  clearInterval(pomodoroState.intervalId);
  pomodoroState = { running:false, seconds: mode==='travail'?25*60:5*60, mode, intervalId:null };

}

function weeklyAddCounts(weeks){
  weeks = weeks || 8;
  const now = new Date();
  const buckets = [];
  for(let i=weeks-1; i>=0; i--){
    const end = new Date(now); end.setDate(end.getDate() - i*7);
    const start = new Date(end); start.setDate(start.getDate()-6); start.setHours(0,0,0,0);
    end.setHours(23,59,59,999);
    const count = data.fiches.filter(f=>{
      const d = new Date(f.dateAdded);
      return d>=start && d<=end;
    }).length;
    buckets.push({ end, count });
  }
  return buckets;
}

function getActivityDays(){
  const days = new Set();
  data.fiches.forEach(f=>{
    [f.dateAdded, f.dateEdited, f.lastViewed].forEach(iso=>{ if(iso) days.add(iso.slice(0,10)); });
  });
  return days;
}
function currentStreak(){
  const days = getActivityDays();
  const oneDay = 86400000;
  let cursor = new Date();
  let key = cursor.toISOString().slice(0,10);
  if(!days.has(key)){
    cursor = new Date(Date.now()-oneDay);
    key = cursor.toISOString().slice(0,10);
    if(!days.has(key)) return 0;
  }
  let streak = 0;
  while(days.has(cursor.toISOString().slice(0,10))){
    streak++;
    cursor = new Date(cursor.getTime()-oneDay);
  }
  return streak;
}

  });

// ---------- Actions fiches ----------
async function submitFiche(ev){
  ev.preventDefault();
  const form = ev.target;
  const subjectId = form.subjectId.value;
  const rawContent = form.content.value.trim();
  const titleOverride = form.titleOverride.value.trim();
  const chapter = form.chapter.value.trim();
  const quiz = form.quiz.value.trim();
  const sources = form.sources.value.trim();
  const links = form.links ? Array.from(form.links.selectedOptions).map(o=>o.value) : [];
  const tags = form.tags.value.trim() ? form.tags.value.split(',').map(t=>t.trim()).filter(Boolean) : [];
  if(!rawContent && !titleOverride){ alert("Ajoute au moins un titre ou du contenu."); return; }
  let title, content;
  if(titleOverride){
    title = titleOverride.slice(0,120);
    content = rawContent;
  }else{
    ({ title, content } = splitTitleContent(rawContent));
  }
  const editId = form.dataset.editId;
  const attachments = pendingAttachments.length ? pendingAttachments.map(a=>({...a})) : undefined;
  if(editId){
    const f = getFiche(editId);
    if(f){
      if(f.title !== title || f.content !== content){
        if(!Array.isArray(f.history)) f.history = [];
        f.history.push({ title: f.title, content: f.content, date: f.dateEdited || f.dateAdded });
        if(f.history.length > 10) f.history = f.history.slice(-10);
      }
      f.subjectId = subjectId; f.title = title; f.content = content; f.chapter = chapter || undefined;
      f.quiz = quiz || undefined; f.links = links.length ? links : undefined; f.tags = tags.length ? tags : undefined;
      f.sources = sources || undefined;
      f.dateEdited = new Date().toISOString(); f.attachments = attachments; delete f.attachment;
    }
  }else{
    data.fiches.push({ id: uid(), subjectId, title, content, chapter: chapter || undefined, quiz: quiz || undefined, links: links.length ? links : undefined, tags: tags.length ? tags : undefined, sources: sources || undefined, dateAdded: new Date().toISOString(), attachments });
  }
  lastSubjectId = subjectId;
  pendingAttachments = [];
  vibrate(15);
  await saveData();
  goToSubject(subjectId);
}

async function undoDelete(){
  if(!lastDeleted) return;
  if(lastDeleted.type==='fiche'){
    data.fiches.push(lastDeleted.fiche);
    const subjectId = lastDeleted.fiche.subjectId;
    lastDeleted = null;
    clearTimeout(window.__undoTimer);
    await saveData();
    goToSubject(subjectId);
  }else if(lastDeleted.type==='subject'){
    const idx = Math.min(lastDeleted.index, data.subjects.length);
    data.subjects.splice(idx, 0, lastDeleted.subject);
    data.fiches.push(...lastDeleted.fiches);
    lastDeleted = null;
    clearTimeout(window.__undoTimer);
    await saveData();
    state = { view: 'manageSubjects' };
    render();
  }
}

  await saveData();
  render();
}

// ---------- Collage intelligent (fiche + quiz + liens en un coup) ----------
function parseFicheBlock(raw){
  const buffers = { titre:[], contenu:[], quiz:[], liens:[] };
  let current = null;
  raw.split('\n').forEach(line=>{
    const m = /^###\s*(TITRE|CONTENU|QUIZ|LIENS)\s*$/i.exec(line.trim());
    if(m){ current = m[1].toLowerCase(); return; }
    if(current) buffers[current].push(line);
  });
  const sections = {};
  Object.keys(buffers).forEach(k=> sections[k] = buffers[k].join('\n').trim());
  return sections;
}

async function applyFullPaste(){
  let raw;
  try{
    raw = await navigator.clipboard.readText();
  }catch(e){
    alert("Impossible de lire le presse-papiers automatiquement (autorisation refusée). Colle le texte manuellement (appui long → Coller) dans le champ Contenu, ou réessaie.");
    return;
  }
  if(!raw || !/###\s*(TITRE|CONTENU)/i.test(raw)){
    alert("Ce texte ne semble pas être une fiche au format attendu (### TITRE / ### CONTENU / ...). Demande à Claude de te la redonner dans ce format, ou colle-la simplement dans le champ Contenu.");
    return;
  }
  const sections = parseFicheBlock(raw);
  const titleInput = document.getElementById('f-title');
  const contentArea = document.getElementById('f-raw');

    Array.from(linksSelect.options).forEach(opt=>{

  }
  const note = total ? ` (${matched}/${total} fiche(s) liée(s) reconnue(s))` : '';
  alert('Fiche remplie automatiquement !' + note);
}

function readAndCompressImage(file, maxWidth, quality){
  maxWidth = maxWidth || 1400; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > maxWidth){ height = Math.round(height * (maxWidth/width)); width = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoInput(ev){

  }catch(e){ alert("Impossible de lire cette photo."); }
  ev.target.value = '';
}

async function handleFileInput(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 3*1024*1024){
    alert("Ce fichier dépasse 3 Mo : il risque de ne pas se sauvegarder correctement sur cet appareil. Essaie un fichier plus léger.");
    return;
  }
  try{
    if(file.type.startsWith('image/')){
      const dataUrl = await readAndCompressImage(file);
      pendingAttachments.push({ type:'image', name:file.name, mime:'image/jpeg', dataUrl });
    }else{
      const dataUrl = await readFileAsDataUrl(file);
      pendingAttachments.push({ type:'file', name:file.name, mime:file.type||'application/octet-stream', dataUrl });
    }
    patchAttachmentPreview();
  }catch(e){ alert("Impossible de lire ce fichier."); }
  ev.target.value = '';
}

let mediaRecorder = null;
let recordedChunks = [];
async function toggleRecording(){
  if(mediaRecorder && mediaRecorder.state==='recording'){
    mediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("L'enregistrement audio n'est pas disponible sur ce navigateur.");
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type:'audio/webm' });
      stream.getTracks().forEach(t=>t.stop());
      const reader = new FileReader();
      reader.onload = () => {
        pendingAttachments.push({ type:'audio', name:'Enregistrement vocal.webm', mime:'audio/webm', dataUrl: reader.result });
        patchAttachmentPreview();
        updateRecordButton();
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    updateRecordButton();
  }catch(e){
    alert("Impossible d'accéder au micro. Vérifie que l'accès au microphone est autorisé.");
  }
}
function updateRecordButton(){
  const btn = document.getElementById('record-btn');
  if(btn) btn.textContent = (mediaRecorder && mediaRecorder.state==='recording') ? '⏹️ Arrêter l\'enregistrement' : '🎤 Enregistrer un audio';
}

async function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const incoming = JSON.parse(text);
    if(!incoming || !Array.isArray(incoming.subjects) || !Array.isArray(incoming.fiches)){
      alert("Ce fichier ne ressemble pas à un export valide.");
      return;
    }
    const existingSubjectIds = new Set(data.subjects.map(s=>s.id));
    incoming.subjects.forEach(s=>{ if(!existingSubjectIds.has(s.id)){ data.subjects.push(s); existingSubjectIds.add(s.id); } });
    const existingFicheIds = new Set(data.fiches.map(f=>f.id));
    let added = 0;
    incoming.fiches.forEach(f=>{ if(!existingFicheIds.has(f.id)){ migrateFicheStatus(f); data.fiches.push(f); existingFicheIds.add(f.id); added++; } });
    await saveData();
    render();
    alert(added + " fiche(s) importée(s) avec succès.");
  }catch(e){
    alert("Impossible de lire ce fichier. Vérifie que c'est bien un export généré par ce site.");
  }
  ev.target.value = '';
}

        <div class="form-actions" style="margin-top:0;">
          <button id="confirm-reset-btn" class="btn" onclick="confirmResetFiches()" disabled style="background:#A3342A;">Confirmer la réinitialisation définitive</button>
          <button class="btn ghost" onclick="cancelResetConfirm()">Annuler</button>
        </div>
      </div>` : `<button class="footer-link" onclick="openResetConfirm()">Réinitialiser mes fiches</button>`}
    </div>
  `;
}

function renderSearchResults(query){
  const q = query.toLowerCase();
  const matches = data.fiches.filter(f => f.title.toLowerCase().includes(q) || f.content.toLowerCase().includes(q) || (f.tags||[]).some(t=>t.toLowerCase().includes(q)));
  const cardsHtml = matches.map(f=>renderFicheCard(f,{showSubject:true})).join('');
  return `
    <p class="eyebrow">Recherche</p>
    <h1 class="hero" style="font-size:2rem;">${matches.length} résultat${matches.length===1?'':'s'} pour « ${esc(query)} »</h1>
    ${matches.length ? `<div class="grid" style="margin-top:26px;">${cardsHtml}</div>` : `<div class="empty-state" style="margin-top:26px;"><p>Aucune fiche ne correspond à cette recherche.</p></div>`}
  `;
}

function renderAllToReview(){
  const list = data.fiches.filter(f=>isDueForReview(f))
    .sort((a,b)=> (b.dateEdited||b.dateAdded).localeCompare(a.dateEdited||a.dateAdded));
  const cardsHtml = list.map(f=>renderFicheCard(f,{showSubject:true})).join('');
  return `
    <p class="eyebrow">Toutes matières</p>
    <h1 class="hero" style="font-size:2rem;">🔶 À revoir</h1>
    <p class="lede">Fiches jamais évaluées, ou dont la date de révision suggérée est passée.</p>
    ${list.length ? `<div class="grid" style="margin-top:6px;">${cardsHtml}</div>` : `<div class="empty-state" style="margin-top:26px;"><p>Rien à revoir pour l'instant, bien joué !</p></div>`}
  `;
}

function sortFilterBarHtml(){
  return `
    <div class="sort-filter-row no-print">
      <select onchange="setSort(this.value)" aria-label="Trier">
        <option value="date-desc" ${currentSort==='date-desc'?'selected':''}>Plus récent d'abord</option>

        <option value="title-desc" ${currentSort==='title-desc'?'selected':''}>Titre Z→A</option>
        <option value="status" ${currentSort==='status'?'selected':''}>Confiance (moins sûr d'abord)</option>

        <option value="maitrisee" ${currentFilter==='maitrisee'?'selected':''}>Bien maîtrisées (4-5)</option>

function renderSubjectView(id){
  const s = getSubject(id);
  if(!s) return renderHome();
  const totalCount = fichesOf(id).length;
  const visible = visibleFichesOf(id);
  let body;
  if(!totalCount){
    body = `<div class="empty-state">
      <p>Aucune fiche ici pour l'instant. La prochaine sur « ${esc(s.name)} » atterrira dans cette page.</p>
      <button class="btn" onclick="openAddFiche('${s.id}')">+ Ajouter une fiche</button>
    </div>`;
  }else if(!visible.length){
    body = `<div class="empty-state"><p>Aucune fiche ne correspond à ce filtre.</p></div>`;
  }else{
    const hasChapters = visible.some(f=>f.chapter && f.chapter.trim());
    if(hasChapters && currentSort!=='manuel'){
      body = groupByChapter(visible).map(g=>`
        <h3 class="chapter-heading">${esc(g.label)}</h3>
        <div class="grid">${g.fiches.map(f=>renderFicheCard(f)).join('')}</div>
      `).join('');
    }else{
      body = `<div class="grid">${visible.map(f=>renderFicheCard(f)).join('')}</div>`;
    }
  }
  const archivedNote = s.archived ? `<div class="reminder-card" style="margin-bottom:20px;"><div class="reminder-label">📦 Matière archivée</div><div class="reminder-line">Elle n'apparaît plus dans le menu ni sur l'accueil. <button type="button" class="link-chip" onclick="toggleArchiveSubject('${s.id}')">Désarchiver</button></div></div>` : '';

  return `
    ${archivedNote}
    <div class="subject-header">
      <div>
        <h1><span class="swatch-lg" style="background:${s.color}"></span>${esc(s.name)}</h1>
        <div class="meta">${totalCount} fiche${totalCount===1?'':'s'}${s.archived ? '' : ' · #'+pad2(activeRank(id)+1)+' par importance'}</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        ${totalCount ? `<button class="btn ghost small" onclick="openFlashcards('${s.id}')">🃏 Réviser</button>` : ''}
        ${totalCount ? `<button class="btn ghost small" onclick="openPrintView('${s.id}')">🖨️ Imprimer</button>` : ''}
        ${totalCount ? `<button class="btn" onclick="openAddFiche('${s.id}')">+ Ajouter une fiche</button>` : ''}
      </div>
    </div>
    ${totalCount ? sortFilterBarHtml() : ''}
    ${body}
  `;
}

function jsQuote(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function renderFicheDetail(id){
  const f = getFiche(id);
  if(!f) return renderHome();
  const s = getSubject(f.subjectId);
  const chapterHtml = f.chapter ? `<div class="fiche-date">📂 ${esc(f.chapter)}</div>` : '';
  const tagsHtml = (f.tags && f.tags.length) ? `<div class="fiche-tags">${f.tags.map(t=>`<button type="button" class="tag-chip" onclick="openTagView('${jsQuote(t)}')">🏷️ ${esc(t)}</button>`).join('')}</div>` : '';
  const linkedFiches = (f.links||[]).map(lid=>getFiche(lid)).filter(Boolean);
  const linksHtml = linkedFiches.length ? `
    <div class="linked-fiches">
      <div class="linked-label">Voir aussi</div>
      ${linkedFiches.map(lf=>`<button type="button" class="link-chip" onclick="openFiche('${lf.id}')">${esc(lf.title)}</button>`).join('')}
    </div>` : '';
  const history = Array.isArray(f.history) ? [...f.history].reverse() : [];
  const historyHtml = history.length ? `
    <details class="history-section">
      <summary>🕐 Historique (${history.length} version${history.length===1?'':'s'} précédente${history.length===1?'':'s'})</summary>
      ${history.map((h,i)=>{
        const realIdx = f.history.length-1-i;
        return `<div class="history-item">
          <div class="history-date">${fmtDate(h.date)}</div>
          <div class="history-title">${esc(h.title)}</div>
          <button type="button" class="btn ghost small" onclick="restoreVersion('${f.id}', ${realIdx})">↺ Restaurer cette version</button>
        </div>`;
      }).join('')}
    </details>` : '';
  const otherFichesOptions = data.subjects.map(sub=>{
    const opts = data.fiches.filter(o=>o.subjectId===sub.id && o.id!==f.id).map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join('');
    return opts ? `<optgroup label="${esc(sub.name)}">${opts}</optgroup>` : '';
  }).join('');
  const mergeHtml = mergePanelOpen ? `
    <div class="reset-confirm-box" style="border-color:var(--border); margin-top:20px;">
      <p style="font-size:0.85rem; color:var(--ink-soft); margin:0 0 10px;">Choisis la fiche qui recevra le contenu de celle-ci (elle sera supprimée après la fusion) :</p>
      <select id="merge-target-select">${otherFichesOptions}</select>
      <div class="form-actions">
        <button class="btn" onclick="mergeFicheInto('${f.id}', document.getElementById('merge-target-select').value)">Fusionner</button>
        <button class="btn ghost" onclick="toggleMergePanel()">Annuler</button>
      </div>
    </div>` : '';
  return `
    <button class="back-link" onclick="goToSubject('${f.subjectId}')">← ${s ? esc(s.name) : 'Retour'}</button>
    <div class="fiche-detail">
      <h1 class="fiche-title">${f.pinned ? '📌 ' : ''}${esc(f.title)}</h1>
      <div class="fiche-date">Ajoutée le ${fmtDate(f.dateAdded)}${f.dateEdited ? ' · modifiée le ' + fmtDate(f.dateEdited) : ''}</div>
      ${chapterHtml}
      ${tagsHtml}
      ${confidenceRowHtml(f)}
      <div class="status-row">
        <button class="status-btn ${f.pinned?'active':''}" onclick="togglePin('${f.id}')">📌 ${f.pinned ? 'Désépingler' : 'Épingler'}</button>
      </div>
      ${renderAttachmentsGallery(f)}
      <div class="fiche-content md-content">${renderMarkdownLite(f.content)}</div>
      ${f.sources ? `<p class="fiche-sources">📚 Sources : ${esc(f.sources)}</p>` : ''}
      ${linksHtml}
      ${historyHtml}
      ${mergeHtml}
      <div class="fiche-actions">
        ${parseQuiz(f.quiz).length ? `<button class="btn ghost" onclick="openQuiz('${f.id}')">❓ Mode quiz</button>` : ''}
        <button class="btn ghost" onclick="openPrintFiche('${f.id}')">🖨️ Exporter en PDF</button>
        <button class="btn ghost" onclick="toggleMergePanel()">🔗 Fusionner avec...</button>
        <button class="btn ghost" onclick="openEditFiche('${f.id}')">Modifier</button>
        <button class="btn ghost" onclick="deleteFiche('${f.id}')">Supprimer cette fiche</button>
      </div>
    </div>
  `;
}

function renderPrintView(subjectId){
  const s = getSubject(subjectId);
  if(!s) return renderHome();
  const fiches = fichesOf(subjectId);
  const fichesHtml = fiches.map(f=>{
    const imgs = migrateAttachments(f).filter(a=>a.type==='image').map(a=>`<img src="${a.url||a.dataUrl}" class="print-img" alt="">`).join('');
    return `<div class="print-fiche">
      <h2>${esc(f.title)}</h2>
      <div class="print-content md-content">${renderMarkdownLite(f.content)}</div>

function renderPrintFiche(ficheId){
  const f = getFiche(ficheId);
  if(!f) return renderHome();
  const imgs = migrateAttachments(f).filter(a=>a.type==='image').map(a=>`<img src="${a.url||a.dataUrl}" class="print-img" alt="">`).join('');

  return `
    <div class="no-print" style="margin-bottom:24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">

    <h1 class="print-title">${esc(f.title)}</h1>

      <div class="print-content md-content">${renderMarkdownLite(f.content)}</div>
      ${imgs}
      ${sourcesHtml}

function renderFlashcards(view){
  const s = getSubject(view.subjectId);
  if(!s) return renderHome();
  const list = visibleFichesOf(view.subjectId);
  if(!list.length) return renderSubjectView(view.subjectId);
  const idx = Math.min(view.index, list.length-1);
  const f = list[idx];
  return `
    <button class="back-link" onclick="goToSubject('${s.id}')">← ${esc(s.name)}</button>
    <label class="checkbox-row no-print" style="justify-content:center;">
      <input type="checkbox" ${flashcardTimerEnabled?'checked':''} onchange="toggleFlashcardTimerPref()">
      <span>⏱️ Révéler automatiquement après 15 secondes</span>
    </label>
    <div class="flashcard-progress">Carte ${idx+1} / ${list.length}${(!view.revealed && flashcardTimerEnabled) ? ` · <span id="flashcard-countdown">${flashcardSecondsLeft}s</span>` : ''}</div>
    <div class="flashcard">
      <h2 class="flashcard-title">${esc(f.title)}</h2>
      ${view.revealed ? `
        ${f.chapter ? `<div class="fiche-date">📂 ${esc(f.chapter)}</div>` : ''}
        ${renderAttachmentsGallery(f)}
        <div class="fiche-content md-content">${renderMarkdownLite(f.content)}</div>
      ` : `<button class="btn" onclick="flashcardReveal()">👁️ Révéler la réponse</button>`}
    </div>
    ${view.revealed ? `<div style="display:flex; justify-content:center;">${confidenceRowHtml(f)}</div>` : ''}
    <div class="flashcard-nav">
      <button class="btn ghost" onclick="flashcardPrev()" ${idx===0?'disabled':''}>← Précédente</button>
      <button class="btn" onclick="flashcardNext()" ${idx===list.length-1?'disabled':''}>Suivante →</button>
    </div>
  `;
}

function renderQuiz(view){
  const f = getFiche(view.ficheId);
  if(!f) return renderHome();
  const pairs = parseQuiz(f.quiz);
  if(!pairs.length) return renderFicheDetail(f.id);
  const idx = Math.min(view.index, pairs.length-1);
  const pair = pairs[idx];
  return `
    <button class="back-link" onclick="openFiche('${f.id}')">← ${esc(f.title)}</button>
    <div class="flashcard-progress">Question ${idx+1} / ${pairs.length}</div>
    <div class="flashcard">
      <h2 class="flashcard-title">${esc(pair.q)}</h2>
      ${view.revealed ? `<div class="fiche-content">${esc(pair.a)}</div>` : `<button class="btn" onclick="quizReveal()">👁️ Voir la réponse</button>`}
    </div>
    <div class="flashcard-nav">
      <button class="btn ghost" onclick="quizPrev()" ${idx===0?'disabled':''}>← Précédente</button>
      <button class="btn" onclick="quizNext()" ${idx===pairs.length-1?'disabled':''}>Suivante →</button>
    </div>
  `;
}

function renderPomodoro(){

    <div class="pomodoro-modes">
      <button class="btn ${pomodoroState.mode==='travail'?'':'ghost'} small" onclick="pomodoroSetMode('travail')">Travail (25 min)</button>
      <button class="btn ${pomodoroState.mode==='pause'?'':'ghost'} small" onclick="pomodoroSetMode('pause')">Pause (5 min)</button>

    <div class="pomodoro-display">

      <div class="pomodoro-label">${pomodoroState.mode==='travail' ? 'Séance de travail' : 'Pause'}</div>
    </div>
    <div class="flashcard-nav">
      <button class="btn" onclick="pomodoroToggle()">${pomodoroState.running ? '⏸️ Pause' : '▶️ Démarrer'}</button>

function renderStats(){
  const buckets = weeklyAddCounts(8);
  const max = Math.max(1, ...buckets.map(b=>b.count));
  const bars = buckets.map(b=>{
    const h = 4 + Math.round((b.count/max)*90);
    const label = b.end.toLocaleDateString('fr-FR',{day:'numeric', month:'short'});
    return `<div class="chart-bar-wrap"><div class="chart-bar" style="height:${h}px" title="${b.count} fiche${b.count===1?'':'s'}"></div><div class="chart-bar-label">${label}</div></div>`;
  }).join('');
  const streak = currentStreak();
  const weekCount = currentWeekCount();
  const goalPct = Math.min(100, Math.round((weekCount/weeklyGoal)*100));
  return `
    <p class="eyebrow">Suivi & motivation</p>
    <h1 class="hero" style="font-size:2rem;">📊 Ton parcours</h1>

    <div class="stats-row">
      <div class="stat"><div class="num">🔥 ${streak}</div><div class="label">Jour${streak===1?'':'s'} d'affilée</div></div>
    </div>

    <div class="howitworks">
      <h2>Fiches ajoutées par semaine</h2>
      <div class="weekly-chart">${bars}</div>
    </div>

    <div class="howitworks">
      <h2>Objectif de la semaine</h2>
      <div class="goal-row">
        <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${goalPct}%"></div></div>
        <div class="goal-text">${weekCount} / ${weeklyGoal} fiches cette semaine</div>
      </div>
      <div class="goal-edit">
        <label for="goal-input">Objectif hebdomadaire :</label>
        <input type="number" id="goal-input" min="1" max="50" value="${weeklyGoal}" onchange="setWeeklyGoal(parseInt(this.value,10))">
      </div>
    </div>

    <div class="howitworks">
      <h2>Détail par matière</h2>
      <div class="table-scroll">
        <table class="md-table subject-stats-table">
          <tr><th>Matière</th><th>Fiches</th><th>Maîtrisé</th><th>À revoir</th><th>Révisions</th></tr>
          ${subjectStatsRows()}
        </table>
      </div>
      <p style="font-size:0.75rem; color:var(--ink-faint); margin:10px 0 0;">« Révisions » compte le nombre de fois où tu as noté ta confiance sur une fiche de cette matière (≈ temps de révision).</p>
    </div>
  `;
}

function subjectStatsRows(){
  return activeSubjects().map(s=>{
    const fiches = fichesOf(s.id);
    const total = fiches.length;
    const mastered = fiches.filter(f=>f.confidence!==undefined && f.confidence>=4).length;
    const due = fiches.filter(f=>isDueForReview(f)).length;
    const reviews = fiches.reduce((sum,f)=>sum+(f.reviewCount||0),0);
    const minutes = Math.round(reviews*0.5);
    return `<tr>
      <td><span class="swatch" style="background:${s.color}"></span> ${esc(s.name)}</td>
      <td>${total}</td>
      <td>${total ? Math.round(mastered/total*100) : 0}%</td>
      <td>${due}</td>
      <td>${reviews} (≈${minutes} min)</td>
    </tr>`;
  }).join('');
}

        <div class="field">
          <label for="f-quiz">Questions de quiz (facultatif)</label>
          <textarea id="f-quiz" name="quiz" placeholder="Une question par ligne, réponse après une barre verticale. Ex. : Capitale de la France ? | Paris" style="min-height:90px;">${esc(initialQuiz)}</textarea>
        </div>
        <div class="field">
          <label for="f-sources">Sources (facultatif)</label>
          <input type="text" id="f-sources" name="sources" placeholder="Ex. : Manuel p.42, cours du 12/03" value="${esc(initialSources)}">
        </div>
        <div class="field">
          <label for="f-links">Fiches liées (facultatif, « voir aussi »)</label>
          <select id="f-links" name="links" multiple size="5">${linkOptions}</select>
          <div style="font-size:0.75rem; color:var(--ink-faint); margin-top:4px;">Ctrl/Cmd + clic pour en choisir plusieurs.</div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">${editing ? 'Enregistrer les modifications' : 'Enregistrer la fiche'}</button>
          <button type="button" class="btn ghost" onclick="${backTarget}">Annuler</button>
        </div>
      </form>

    </div>
  `;
}

function renderAddSubjectForm(){
  const swatchesHtml = SWATCHES.map(hex=>
    `<div class="swatch-option ${hex===pickedColor?'selected':''}" style="background:${hex}" onclick="pickColor('${hex}')"></div>`
  ).join('');
  return `
    <button class="back-link" onclick="goHome()">← Retour</button>
    <div class="form-panel">
      <h1>Nouvelle matière</h1>
      <form onsubmit="submitSubject(event)">
        <div class="field">
          <label for="s-name">Nom de la matière</label>
          <input type="text" id="s-name" name="name" placeholder="Ex. : SVT" required>
        </div>
        <div class="field">
          <label for="s-code">Code court (affiché sur l'onglet)</label>
          <input type="text" id="s-code" name="code" placeholder="Ex. : SVT" maxlength="5">
        </div>
        <div class="field">
          <label>Couleur de l'onglet</label>
          <div class="swatch-picker">${swatchesHtml}</div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Créer la matière</button>
          <button type="button" class="btn ghost" onclick="goHome()">Annuler</button>
        </div>
      </form>
    </div>
  `;
}

function renderManageSubjects(){
  const active = activeSubjects();
  const archived = data.subjects.filter(s=>s.archived);
  const rows = active.map((s,i)=>{
    const count = fichesOf(s.id).length;
    return `<div class="manage-row" draggable="true" ondragstart="handleDragStart('${s.id}')" ondragover="handleDragOver(event)" ondrop="handleDrop(event,'${s.id}')">
      <span class="drag-handle" title="Glisser pour réordonner">⠿</span>
      <span class="swatch" style="background:${s.color}"></span>
      <span class="manage-name">${pad2(i+1)}. ${esc(s.name)} <span class="manage-count">(${count} fiche${count===1?'':'s'})</span></span>
      <div class="manage-actions">
        <button type="button" class="btn ghost small" onclick="moveSubject('${s.id}',-1)" ${i===0?'disabled':''} aria-label="Monter dans l'ordre">↑</button>
        <button type="button" class="btn ghost small" onclick="moveSubject('${s.id}',1)" ${i===active.length-1?'disabled':''} aria-label="Descendre dans l'ordre">↓</button>
        <button type="button" class="btn ghost small" onclick="openEditSubject('${s.id}')">Renommer</button>
        <button type="button" class="btn ghost small" onclick="toggleArchiveSubject('${s.id}')">📦 Archiver</button>
        <button type="button" class="btn ghost small" onclick="deleteSubject('${s.id}')">Supprimer</button>
      </div>
    </div>`;
  }).join('');
  const archivedRows = archived.map(s=>{
    const count = fichesOf(s.id).length;
    return `<div class="manage-row">
      <span class="swatch" style="background:${s.color}"></span>
      <span class="manage-name">${esc(s.name)} <span class="manage-count">(${count} fiche${count===1?'':'s'})</span></span>
      <div class="manage-actions">
        <button type="button" class="btn ghost small" onclick="toggleArchiveSubject('${s.id}')">📤 Désarchiver</button>
        <button type="button" class="btn ghost small" onclick="deleteSubject('${s.id}')">Supprimer</button>
      </div>
    </div>`;
  }).join('');
  return `
    <button class="back-link" onclick="goHome()">← Retour</button>
    <div class="form-panel" style="max-width:760px;">
      <h1>Gérer les matières</h1>
      <p style="color:var(--ink-soft); font-size:0.88rem; margin-top:-16px; margin-bottom:20px;">Glisse une matière (⠿) pour la réordonner, ou utilise les flèches. L'ordre est celui utilisé partout dans le site.</p>
      <div class="manage-list">${rows}</div>
      <div class="form-actions"><button type="button" class="btn" onclick="openAddSubject()">+ Nouvelle matière</button></div>
      ${archived.length ? `
      <h2 style="margin-top:30px;">Matières archivées</h2>
      <div class="manage-list">${archivedRows}</div>` : ''}
    </div>
  `;
}

function renderEditSubjectForm(id){
  const s = getSubject(id);
  if(!s) return renderManageSubjects();
  const swatchesHtml = SWATCHES.map(hex=>
    `<div class="swatch-option ${hex===pickedColor?'selected':''}" style="background:${hex}" onclick="pickColor('${hex}')"></div>`
  ).join('');
  return `
    <button class="back-link" onclick="openManageSubjects()">← Retour</button>
    <div class="form-panel">
      <h1>Modifier « ${esc(s.name)} »</h1>
      <form onsubmit="submitEditSubject(event)" data-edit-id="${s.id}">
        <div class="field">
          <label for="es-name">Nom</label>
          <input type="text" id="es-name" name="name" value="${esc(s.name)}" required>
        </div>
        <div class="field">
          <label for="es-code">Code court</label>
          <input type="text" id="es-code" name="code" value="${esc(s.code)}" maxlength="5">
        </div>
        <div class="field">
          <label>Couleur</label>
          <div class="swatch-picker">${swatchesHtml}</div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Enregistrer</button>
          <button type="button" class="btn ghost" onclick="openManageSubjects()">Annuler</button>
        </div>
      </form>
    </div>
  `;
}

// ---------- Glisser pour supprimer (mobile) ----------
let swipeStartX = null;
let swipeCardEl = null;
document.addEventListener('touchstart', (e)=>{
  const card = e.target.closest('.fiche-card');
  if(!card) return;
  swipeStartX = e.touches[0].clientX;
  swipeCardEl = card;
  swipeCardEl.style.transition = 'none';
}, {passive:true});
document.addEventListener('touchmove', (e)=>{
  if(!swipeCardEl || swipeStartX===null) return;
  const dx = e.touches[0].clientX - swipeStartX;
  if(dx < 0){
    swipeCardEl.style.transform = `translateX(${Math.max(dx,-110)}px)`;
    swipeCardEl.style.opacity = String(Math.max(0.3, 1 + dx/220));
  }
}, {passive:true});
document.addEventListener('touchend', ()=>{
  if(!swipeCardEl){ swipeStartX = null; return; }
  const match = /translateX\((-?\d+(?:\.\d+)?)px\)/.exec(swipeCardEl.style.transform || '');
  const dx = match ? parseFloat(match[1]) : 0;
  const card = swipeCardEl;
  card.style.transition = 'transform 150ms ease, opacity 150ms ease';
  if(dx < -70){
    const id = card.getAttribute('data-fiche-id');
    card.style.transform = 'translateX(-100%)';
    card.style.opacity = '0';
    setTimeout(()=>{ if(id) deleteFiche(id); }, 140);
  }else{
    card.style.transform = '';
    card.style.opacity = '';
  }
  swipeStartX = null;
  swipeCardEl = null;
});

initTheme();
initFontSize();
initRailCollapse();
initWeeklyGoal();
initFlashcardTimerPref();
loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.log('SW non enregistré', e));
  });
}
</script>
